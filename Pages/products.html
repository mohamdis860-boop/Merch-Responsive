<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تصفح جميع المنتجات في متجرنا - فلترة وترتيب وبحث">
    <title>المنتجات - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #22c55e;
            --error: #ef4444;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-dim: rgba(255, 255, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 18px;
            --transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        html {
            background-color: #0a0a1a !important;
            overscroll-behavior: none;
        }

        body {
            background-color: #0a0a1a !important;
            background-image: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        @media (max-width: 768px) {
            body {
                background-image: none !important;
                animation: none !important;
            }
            .bg-animation { display: none !important; }
        }

        .bg-animation {
            position: fixed; inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }
        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(60px, -50px) scale(1.15); }
            50%      { transform: translate(-40px, 40px) scale(0.9); }
            75%      { transform: translate(30px, -30px) scale(1.08); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
        }
        .back-btn:hover { color: var(--primary); transform: translateX(-6px); }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 6s ease infinite;
        }
        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        .page-header p { font-size: 17px; color: var(--text-muted); }

        .toolbar {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            display: flex;
            align-items: center;
            background: var(--glass-strong);
            border-radius: 50px;
            padding: 0 18px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .search-box:focus-within {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.25);
        }
        .search-box i { color: var(--text-muted); font-size: 15px; }
        .search-box:focus-within i { color: var(--primary); }
        .search-box input {
            background: transparent;
            border: none;
            padding: 13px 14px;
            color: white;
            font-size: 15px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }
        .search-box input::placeholder { color: var(--text-dim); }

        .toolbar select {
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 11px 18px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            min-width: 160px;
            transition: var(--transition);
        }
        .toolbar select:hover,
        .toolbar select:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
        }
        .toolbar select option {
            background: #1a1a2e;
            color: white;
        }

        .view-toggle {
            display: inline-flex;
            gap: 4px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 4px;
        }
        .view-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
        }
        .view-btn:hover { color: white; }
        .view-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent3));
            color: white;
            box-shadow: 0 4px 14px rgba(255, 107, 107, 0.35);
        }

        .btn-filters-toggle {
            padding: 11px 20px;
            border-radius: 50px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            position: relative;
            white-space: nowrap;
        }
        .btn-filters-toggle:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--primary);
        }
        .btn-filters-toggle.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        .btn-filters-toggle .filter-count {
            display: none;
            background: #fff;
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }
        .btn-filters-toggle.has-filters .filter-count { display: flex; }
        .btn-filters-toggle .chevron { transition: transform 0.3s; }
        .btn-filters-toggle.active .chevron { transform: rotate(180deg); }

        .filters-panel {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 0.3s, margin 0.3s, padding 0.3s;
            padding: 0 24px;
        }
        .filters-panel.open {
            max-height: 1200px;
            opacity: 1;
            padding: 24px;
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .filter-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
        }
        .filter-block-title {
            font-size: 14px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-block-title i { color: var(--primary); font-size: 14px; }

        .price-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .price-inputs input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            text-align: center;
            transition: var(--transition);
            min-width: 0;
        }
        .price-inputs input:focus {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.12);
        }
        .price-inputs input::placeholder {
            color: var(--text-dim);
            font-size: 12px;
        }
        .price-inputs .dash {
            color: var(--text-dim);
            font-weight: 700;
        }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 140px;
            overflow-y: auto;
        }
        .categories-list::-webkit-scrollbar { width: 4px; }
        .categories-list::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 107, 0.3);
            border-radius: 4px;
        }

        .cat-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        .cat-checkbox:hover {
            background: rgba(255, 107, 107, 0.08);
            color: white;
        }
        .cat-checkbox input { display: none; }
        .cat-checkbox .checkmark {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .cat-checkbox .checkmark i {
            font-size: 8px;
            color: white;
            opacity: 0;
            transform: scale(0);
            transition: 0.2s;
        }
        .cat-checkbox input:checked ~ .checkmark {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
        }
        .cat-checkbox input:checked ~ .checkmark i {
            opacity: 1;
            transform: scale(1);
        }
        .cat-checkbox .cat-count {
            margin-right: auto;
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .chip-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip-option {
            cursor: pointer;
            user-select: none;
        }
        .chip-option input { display: none; }
        .chip-option span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
        }
        .chip-option:hover span {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #fff;
        }
        .chip-option input:checked ~ span {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        .chip-option .stars {
            display: inline-flex;
            gap: 1px;
            color: var(--secondary);
            font-size: 10px;
        }

        .filters-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .filters-footer .result-hint {
            font-size: 13px;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filters-footer .result-hint strong {
            color: var(--secondary);
            font-weight: 800;
        }
        .filters-footer .actions {
            display: flex;
            gap: 10px;
        }

        .btn-filter-action {
            padding: 11px 22px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            border: none;
        }
        .btn-filter-action.apply {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        .btn-filter-action.apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
        }
        .btn-filter-action.reset {
            background: var(--glass-strong);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border);
        }
        .btn-filter-action.reset:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.4);
            color: var(--primary);
        }

        .results-count-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 0 4px;
        }
        .results-count {
            color: var(--text-muted);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .results-count i { color: var(--primary); }
        .results-count span {
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.4);
        }

        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 12px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15), rgba(108, 92, 231, 0.15));
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            animation: chipFadeIn 0.3s;
        }
        @keyframes chipFadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }
        .filter-chip button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: 0.2s;
        }
        .filter-chip button:hover {
            background: rgba(255, 107, 107, 0.4);
            color: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-grid.list-view {
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .product-grid.list-view .product-card {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
        }
        .product-grid.list-view .product-card .product-id-badge,
        .product-grid.list-view .product-card .product-cat {
            margin-bottom: 4px;
        }
        .product-grid.list-view .product-card h4 {
            min-height: auto;
            margin-bottom: 4px;
        }
        .product-grid.list-view .product-card .product-rating,
        .product-grid.list-view .product-card .price {
            margin-bottom: 4px;
            margin-top: 0;
        }
        .product-grid.list-view .product-card .card-actions {
            margin-top: 0;
        }

        .product-card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: var(--glass-strong);
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35), 0 0 30px rgba(255, 107, 107, 0.18);
        }

        .product-card .product-id-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }
        .product-card .product-cat {
            display: inline-block;
            background: rgba(108, 92, 231, 0.15);
            color: #a29bfe;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
            margin-bottom: 10px;
        }
        .product-card h4 {
            font-size: 16px;
            margin-bottom: 6px;
            min-height: 44px;
            transition: 0.3s;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card:hover h4 { color: var(--secondary); }
        .product-card h4 i {
            color: var(--primary);
            margin-left: 6px;
            font-size: 13px;
        }
        .product-card .product-rating {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .product-card .product-rating .stars {
            display: inline-flex;
            gap: 2px;
            color: var(--secondary);
            font-size: 11px;
        }
        .product-card .product-rating .stars .empty { color: rgba(255, 255, 255, 0.15); }
        .product-card .price {
            font-size: 20px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 8px;
            text-shadow: 0 0 12px rgba(255, 217, 61, 0.3);
        }
        .product-card .price i {
            font-size: 14px;
            margin-left: 6px;
        }

        .product-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: stretch;
        }
        .product-card .btn-sm {
            padding: 8px 16px;
            border: none;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .product-card .btn-cart {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }
        .product-card .btn-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5);
        }
        .product-card .btn-cart:disabled {
            opacity: 0.7;
            cursor: default;
            background: var(--success);
        }
        .product-card .btn-details {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 46px;
            flex: 0 0 46px;
        }
        .product-card .btn-details:hover {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-color: transparent;
        }

        .btn-compare-toggle {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 14px;
            position: relative;
            flex-shrink: 0;
        }
        .btn-compare-toggle:hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: rgba(108, 92, 231, 0.5);
            color: #a29bfe;
            transform: translateY(-2px);
        }
        .btn-compare-toggle.active {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.5);
        }
        .btn-compare-toggle.active::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: -4px;
            left: -4px;
            background: var(--success);
            color: white;
            font-size: 9px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 2px solid #0a0a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }
        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        .empty-state h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .load-more-section {
            margin-top: 40px;
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
        }
        .load-more-section.hidden { display: none; }

        .load-more-info {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .load-more-info strong {
            color: var(--secondary);
            font-weight: 800;
            font-size: 16px;
        }
        .load-more-progress {
            width: 100%;
            max-width: 400px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin: 0 auto 20px;
            overflow: hidden;
        }
        .load-more-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }
        .btn-load-more {
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.35);
            transition: var(--transition);
            min-width: 220px;
        }
        .btn-load-more:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.55);
        }
        .btn-load-more:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-load-more.loading i { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .no-more-products {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 50px;
            color: var(--success);
            font-size: 14px;
            font-weight: 700;
        }
        .no-more-products i { font-size: 18px; }

        .back-to-top {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent3));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: var(--transition);
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover { transform: translateY(-4px) scale(1.05); }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        .offline-banner.show { transform: translateY(0); }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 28px; }
            .page-header p { font-size: 15px; }
            .main-content { padding: 25px 15px; }
            .toolbar { padding: 12px 14px; gap: 8px; }
            .search-box { min-width: 100%; order: 1; }
            .toolbar select { flex: 1; min-width: 0; order: 2; }
            .view-toggle { order: 3; }
            .btn-filters-toggle { flex: 1; justify-content: center; order: 4; }

            .filters-panel { padding: 0 16px; border-radius: 16px; }
            .filters-panel.open { padding: 16px; }

            .filters-grid { grid-template-columns: 1fr; gap: 12px; }
            .filter-block { padding: 14px; }

            .filters-footer { flex-direction: column; align-items: stretch; }
            .filters-footer .actions { width: 100%; }
            .btn-filter-action { flex: 1; justify-content: center; }

            .product-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .product-card { padding: 14px; }
            .product-card h4 { font-size: 14px; min-height: 40px; }
            .product-card .price { font-size: 17px; }

            .product-card .card-actions { flex-wrap: wrap; }
            .product-card .btn-cart { flex: 1 1 100%; order: 1; }
            .product-card .btn-details,
            .product-card .btn-compare-toggle {
                flex: 0 0 44px;
                max-width: 44px;
                min-width: 44px;
                height: 44px;
                order: 2;
            }

            .back-to-top { bottom: 90px !important; left: 15px !important; }

            .product-grid.list-view .product-card {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .btn-load-more { width: 100%; padding: 13px 20px; font-size: 14px; }
        }
        @media (max-width: 500px) {
            .product-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 22px; }
            .chip-option span { font-size: 12px; padding: 6px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <script src="../shared/config.js"></script>

    <script>
        (function() {
            'use strict';

            const PRODUCTS_CACHE_KEY = 'products_cache_v1';
            const CATEGORIES_CACHE_KEY = 'categories_cache_v1';
            const CACHE_TTL_MS = 5 * 60 * 1000;
            const SEARCH_DEBOUNCE_MS = 250;
            const VIEW_STORAGE_KEY = 'products_view_mode';

            const supabase            = window.getSupabase();
            const productsContainer   = document.getElementById('productsContainer');
            const searchInput         = document.getElementById('searchInput');
            const sortFilter          = document.getElementById('sortFilter');
            const resultCount         = document.getElementById('resultCount');
            const panelResultCount    = document.getElementById('panelResultCount');
            const priceMin            = document.getElementById('priceMin');
            const priceMax            = document.getElementById('priceMax');
            const categoriesList      = document.getElementById('categoriesList');
            const availabilityList    = document.getElementById('availabilityList');
            const ratingList          = document.getElementById('ratingList');
            const activeFilters       = document.getElementById('activeFilters');
            const filtersToggle       = document.getElementById('filtersToggle');
            const filtersPanel        = document.getElementById('filtersPanel');
            const filterCount         = document.getElementById('filterCount');
            const applyFiltersBtn     = document.getElementById('applyFiltersBtn');
            const resetFiltersBtn     = document.getElementById('resetFiltersBtn');
            const loadMoreSection     = document.getElementById('loadMoreSection');
            const loadMoreBtn         = document.getElementById('loadMoreBtn');
            const loadMoreProgress    = document.getElementById('loadMoreProgress');
            const showingCount        = document.getElementById('showingCount');
            const totalCount          = document.getElementById('totalCount');
            const noMoreProducts      = document.getElementById('noMoreProducts');
            const backToTop           = document.getElementById('backToTop');
            const offlineBanner       = document.getElementById('offlineBanner');

            let allProducts = [];
            let filteredProducts = [];
            let categories = [];
            let categoryMap = {};
            let currentPage = 0;
            let currentView = localStorage.getItem(VIEW_STORAGE_KEY) || 'grid';
            let searchDebounceTimer = null;

            const ITEMS_PER_PAGE = window.innerWidth <= 768 ? 8 : 12;

            const safeToString = (v) => (v === null || v === undefined) ? '' : String(v);

            const escapeHtml = (text) => {
                if (text == null) return '';
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            };

            const formatNumber = (n) => new Intl.NumberFormat('ar-EG').format(Number(n) || 0);

            const isAvailable = (status) => {
                if (status === null || status === undefined) return true;
                const s = String(status).toLowerCase().trim();
                return !(
                    s === 'out of stock' || s === 'out_of_stock' || s === 'outofstock' ||
                    s === 'unavailable' || s === 'غير متوفر' || s === 'نفذ' ||
                    s === 'نفذت' || s === 'false' || s === '0' || s === 'no'
                );
            };

            const debounce = (fn, ms) => {
                return function(...args) {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() => fn.apply(this, args), ms);
                };
            };

            function readCache(key) {
                try {
                    const raw = sessionStorage.getItem(key);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (Date.now() - parsed.ts > CACHE_TTL_MS) return null;
                    return parsed.data;
                } catch (e) { return null; }
            }
            function writeCache(key, data) {
                try {
                    sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
                } catch (e) { /* ignore */ }
            }

            function updateLoadMoreUI() {
                const total = filteredProducts.length;
                const shown = Math.min((currentPage + 1) * ITEMS_PER_PAGE, total);

                if (showingCount) showingCount.textContent = formatNumber(shown);
                if (totalCount) totalCount.textContent = formatNumber(total);

                if (loadMoreProgress) {
                    const percent = total > 0 ? (shown / total) * 100 : 0;
                    loadMoreProgress.style.width = percent + '%';
                }

                if (shown >= total) {
                    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
                    if (noMoreProducts) noMoreProducts.style.display = 'inline-flex';
                } else {
                    if (loadMoreBtn) loadMoreBtn.style.display = 'inline-flex';
                    if (noMoreProducts) noMoreProducts.style.display = 'none';
                }

                if (loadMoreSection) {
                    loadMoreSection.classList.toggle('hidden', total === 0);
                }
            }

            function renderCategories() {
                if (categories.length === 0) {
                    categoriesList.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">لا توجد تصنيفات</p>';
                    return;
                }

                const counts = {};
                allProducts.forEach(p => {
                    const cid = safeToString(p.Category_ID);
                    if (cid) counts[cid] = (counts[cid] || 0) + 1;
                });

                categoriesList.innerHTML = '';
                categories.forEach(cat => {
                    const cid = safeToString(cat.Category_ID);
                    const cname = safeToString(cat.Category_Name) || 'بدون اسم';
                    const count = counts[cid] || 0;

                    const label = document.createElement('label');
                    label.className = 'cat-checkbox';
                    label.innerHTML = `
                        <input type="checkbox" value="${escapeHtml(cid)}" data-filter="category">
                        <span class="checkmark"><i class="fas fa-check"></i></span>
                        <span>${escapeHtml(cname)}</span>
                        <span class="cat-count">${formatNumber(count)}</span>
                    `;
                    categoriesList.appendChild(label);
                });
            }

            function getActiveFilters() {
                const minPrice = parseFloat(priceMin.value) || 0;
                const maxPrice = parseFloat(priceMax.value) || Infinity;

                const selectedCats = Array.from(
                    document.querySelectorAll('input[data-filter="category"]:checked')
                ).map(cb => cb.value);

                const availability = document.querySelector('input[name="availability"]:checked')?.value || 'all';
                const minRating = parseFloat(document.querySelector('input[name="rating"]:checked')?.value || '0');

                return { minPrice, maxPrice, selectedCats, availability, minRating };
            }

            function countActiveFilters() {
                let count = 0;
                if (!isNaN(parseFloat(priceMin.value)) || !isNaN(parseFloat(priceMax.value))) count++;
                if (document.querySelectorAll('input[data-filter="category"]:checked').length > 0) count++;
                const avail = document.querySelector('input[name="availability"]:checked')?.value;
                if (avail && avail !== 'all') count++;
                if (parseFloat(document.querySelector('input[name="rating"]:checked')?.value || '0') > 0) count++;
                return count;
            }

            function renderActiveChips() {
                activeFilters.innerHTML = '';
                const { minPrice, maxPrice, selectedCats, availability, minRating } = getActiveFilters();
                const chips = [];

                if (minPrice > 0 || maxPrice < Infinity) {
                    const minTxt = minPrice > 0 ? formatNumber(minPrice) : '0';
                    const maxTxt = maxPrice < Infinity ? formatNumber(maxPrice) : '∞';
                    chips.push({
                        label: `💰 ${minTxt} - ${maxTxt} ج.م`,
                        clear: () => { priceMin.value = ''; priceMax.value = ''; }
                    });
                }
                selectedCats.forEach(cid => {
                    const cname = categoryMap[cid] || cid;
                    chips.push({
                        label: `📂 ${cname}`,
                        clear: () => {
                            const cb = document.querySelector(`input[data-filter="category"][value="${cid}"]`);
                            if (cb) cb.checked = false;
                        }
                    });
                });
                if (availability !== 'all') {
                    chips.push({
                        label: availability === 'available' ? '✅ متوفر' : '❌ غير متوفر',
                        clear: () => {
                            const r = document.querySelector('input[name="availability"][value="all"]');
                            if (r) r.checked = true;
                        }
                    });
                }
                if (minRating > 0) {
                    chips.push({
                        label: `⭐ ${minRating}+ نجوم`,
                        clear: () => {
                            const r = document.querySelector('input[name="rating"][value="0"]');
                            if (r) r.checked = true;
                        }
                    });
                }

                chips.forEach(chip => {
                    const el = document.createElement('div');
                    el.className = 'filter-chip';
                    el.innerHTML = `
                        <span>${escapeHtml(chip.label)}</span>
                        <button type="button" aria-label="إزالة الفلتر">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    el.querySelector('button').addEventListener('click', () => {
                        chip.clear();
                        applyFilters();
                    });
                    activeFilters.appendChild(el);
                });

                const count = countActiveFilters();
                filterCount.textContent = count;
                filtersToggle.classList.toggle('has-filters', count > 0);
            }

            function createProductCard(item, index) {
                const productId = safeToString(item.Product_ID);
                const productName = safeToString(item.Product_Name) || 'بدون اسم';
                const price = parseFloat(item.Selling_Price) || 0;
                const imageUrl = item.Image_URL || '';
                const rating = parseFloat(item.Rating) || 0;
                const reviewCount = parseInt(item.Review_Count, 10) || 0;
                const catId = safeToString(item.Category_ID);
                const catName = categoryMap[catId] || '';

                const icons = ['fa-tag', 'fa-box', 'fa-cube', 'fa-gem', 'fa-star', 'fa-crown'];
                const icon = icons[index % icons.length];

                const card = document.createElement('div');
                card.className = 'product-card';
                card.dataset.id = productId;

                const badge = document.createElement('div');
                badge.className = 'product-id-badge';
                badge.innerHTML = `<i class="fas fa-barcode"></i> ${escapeHtml(productId)}`;

                const catBadge = document.createElement('div');
                catBadge.className = 'product-cat';
                catBadge.innerHTML = `<i class="fas fa-tag"></i> ${escapeHtml(catName || '—')}`;

                const title = document.createElement('h4');
                title.innerHTML = `<i class="fas ${icon}"></i> ${escapeHtml(productName)}`;

                const ratingEl = document.createElement('div');
                ratingEl.className = 'product-rating';
                const fullStars = Math.round(rating);
                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    starsHTML += i <= fullStars
                        ? '<i class="fas fa-star"></i>'
                        : '<i class="fas fa-star empty"></i>';
                }
                ratingEl.innerHTML = `
                    <span class="stars">${starsHTML}</span>
                    <span>${rating.toFixed(1)} (${formatNumber(reviewCount)})</span>
                `;

                const priceEl = document.createElement('div');
                priceEl.className = 'price';
                priceEl.innerHTML = `<i class="fas fa-tag"></i> ${price > 0 ? formatNumber(price) + ' ج.م' : '—'}`;

                const actions = document.createElement('div');
                actions.className = 'card-actions';

                const cartBtn = document.createElement('button');
                cartBtn.className = 'btn-sm btn-cart';
                cartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> أضف`;
                cartBtn.setAttribute('aria-label', `أضف ${productName} للسلة`);
                cartBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    this.disabled = true;
                    this.innerHTML = `<i class="fas fa-check"></i> أضيف`;
                    window.addToCartItem?.(productId, productName, price, imageUrl);
                    setTimeout(() => {
                        this.disabled = false;
                        this.innerHTML = `<i class="fas fa-cart-plus"></i> أضف`;
                    }, 1500);
                });

                const detailsBtn = document.createElement('button');
                detailsBtn.className = 'btn-sm btn-details';
                detailsBtn.innerHTML = `<i class="fas fa-eye"></i>`;
                detailsBtn.setAttribute('aria-label', `عرض تفاصيل ${productName}`);
                detailsBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                const compareBtn = document.createElement('button');
                compareBtn.className = 'btn-compare-toggle';
                compareBtn.setAttribute('aria-label', 'أضف للمقارنة');
                compareBtn.innerHTML = `<i class="fas fa-balance-scale"></i>`;
                if (window.isInCompare && window.isInCompare(productId)) {
                    compareBtn.classList.add('active');
                }
                compareBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!window.toggleCompare) return;
                    const added = window.toggleCompare({
                        id: productId,
                        name: productName,
                        price: price,
                        image: imageUrl
                    });
                    this.classList.toggle('active', added);
                });

                actions.appendChild(cartBtn);
                actions.appendChild(detailsBtn);
                actions.appendChild(compareBtn);

                card.appendChild(badge);
                card.appendChild(catBadge);
                card.appendChild(title);
                card.appendChild(ratingEl);
                card.appendChild(priceEl);
                card.appendChild(actions);

                card.addEventListener('click', () => {
                    window.location.href = `product-details.html?id=${encodeURIComponent(productId)}`;
                });

                return card;
            }

            function renderProducts(resetPage = true) {
                if (!filteredProducts || filteredProducts.length === 0) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search-minus"></i>
                            <h3>مفيش منتجات مطابقة</h3>
                            <p>جرب تغير الفلاتر أو ابحث بكلمة تانية</p>
                        </div>
                    `;
                    resultCount.textContent = '0';
                    if (panelResultCount) panelResultCount.textContent = '0';
                    if (loadMoreSection) loadMoreSection.classList.add('hidden');
                    return;
                }

                if (resetPage) currentPage = 0;

                const totalToShow = Math.min((currentPage + 1) * ITEMS_PER_PAGE, filteredProducts.length);
                const productsToShow = filteredProducts.slice(0, totalToShow);

                resultCount.textContent = formatNumber(filteredProducts.length);
                if (panelResultCount) panelResultCount.textContent = formatNumber(filteredProducts.length);

                const grid = document.createElement('div');
                grid.className = 'product-grid';
                if (currentView === 'list') grid.classList.add('list-view');

                productsToShow.forEach((item, index) => {
                    grid.appendChild(createProductCard(item, index));
                });

                productsContainer.innerHTML = '';
                productsContainer.appendChild(grid);

                updateLoadMoreUI();

                if (window.AOS?.refresh) AOS.refresh();
            }

            function loadMore() {
                const total = filteredProducts.length;
                const shown = Math.min((currentPage + 1) * ITEMS_PER_PAGE, total);
                if (shown >= total) return;

                if (loadMoreBtn) {
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.classList.add('loading');
                    loadMoreBtn.innerHTML = '<i class="fas fa-spinner"></i><span>جاري التحميل...</span>';
                }

                setTimeout(() => {
                    currentPage++;
                    renderProducts(false);

                    if (loadMoreBtn) {
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.classList.remove('loading');
                        loadMoreBtn.innerHTML = '<i class="fas fa-plus-circle"></i><span>عرض المزيد</span>';
                    }
                }, 300);
            }

            function applyFilters() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const sortValue = sortFilter.value;
                const { minPrice, maxPrice, selectedCats, availability, minRating } = getActiveFilters();

                let filtered = allProducts.filter(item => {
                    const name = safeToString(item.Product_Name).toLowerCase();
                    const id = safeToString(item.Product_ID).toLowerCase();
                    const matchSearch = !searchTerm || name.includes(searchTerm) || id.includes(searchTerm);

                    const price = parseFloat(item.Selling_Price) || 0;
                    const matchPrice = price >= minPrice && price <= maxPrice;

                    const catId = safeToString(item.Category_ID);
                    const matchCat = selectedCats.length === 0 || selectedCats.includes(catId);

                    const available = isAvailable(item.Status);
                    let matchAvail = true;
                    if (availability === 'available') matchAvail = available;
                    else if (availability === 'out') matchAvail = !available;

                    const rating = parseFloat(item.Rating) || 0;
                    const matchRating = rating >= minRating;

                    return matchSearch && matchPrice && matchCat && matchAvail && matchRating;
                });

                filtered = [...filtered];

                switch (sortValue) {
                    case 'price_asc':
                        filtered.sort((a, b) => (parseFloat(a.Selling_Price) || 0) - (parseFloat(b.Selling_Price) || 0));
                        break;
                    case 'price_desc':
                        filtered.sort((a, b) => (parseFloat(b.Selling_Price) || 0) - (parseFloat(a.Selling_Price) || 0));
                        break;
                    case 'rating_desc':
                        filtered.sort((a, b) => (parseFloat(b.Rating) || 0) - (parseFloat(a.Rating) || 0));
                        break;
                    case 'name_asc':
                        filtered.sort((a, b) => safeToString(a.Product_Name).localeCompare(safeToString(b.Product_Name), 'ar'));
                        break;
                    case 'name_desc':
                        filtered.sort((a, b) => safeToString(b.Product_Name).localeCompare(safeToString(a.Product_Name), 'ar'));
                        break;
                }

                filteredProducts = filtered;
                renderProducts(true);
                renderActiveChips();
            }

            async function loadData() {
                if (!supabase) {
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-plug-circle-xmark" style="color:var(--error);"></i>
                            <h3 style="color:var(--error);">تعذر الاتصال بالخادم</h3>
                        </div>
                    `;
                    return;
                }

                try {
                    const cachedProducts = readCache(PRODUCTS_CACHE_KEY);
                    const cachedCategories = readCache(CATEGORIES_CACHE_KEY);

                    if (cachedProducts && cachedCategories) {
                        categories = cachedCategories;
                        categoryMap = {};
                        categories.forEach(c => {
                            categoryMap[safeToString(c.Category_ID)] = safeToString(c.Category_Name);
                        });
                        allProducts = cachedProducts;
                        renderCategories();
                        filteredProducts = [...allProducts];
                        applyFilters();
                        return;
                    }

                    const [catRes, prodRes] = await Promise.all([
                        supabase.from('Category').select('Category_ID, Category_Name').limit(200),
                        supabase.from('Product').select('Product_ID, Product_Name, Selling_Price, Image_URL, Category_ID, Status, Rating, Review_Count')
                    ]);

                    if (catRes.error) throw catRes.error;
                    if (prodRes.error) throw prodRes.error;

                    categories = catRes.data || [];
                    categoryMap = {};
                    categories.forEach(c => {
                        categoryMap[safeToString(c.Category_ID)] = safeToString(c.Category_Name);
                    });

                    allProducts = prodRes.data || [];

                    writeCache(PRODUCTS_CACHE_KEY, allProducts);
                    writeCache(CATEGORIES_CACHE_KEY, categories);

                    renderCategories();
                    filteredProducts = [...allProducts];
                    applyFilters();

                } catch (err) {
                    console.error('❌ Error:', err);
                    productsContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-triangle-exclamation" style="color:var(--error);"></i>
                            <h3 style="color:var(--error);">${escapeHtml(err.message)}</h3>
                        </div>
                    `;
                }
            }

            function applyView() {
                document.querySelectorAll('.view-btn').forEach(btn => {
                    const isActive = btn.dataset.view === currentView;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', String(isActive));
                });
                const grid = productsContainer.querySelector('.product-grid');
                if (grid) {
                    grid.classList.toggle('list-view', currentView === 'list');
                }
            }

            const debouncedApplyFilters = debounce(applyFilters, SEARCH_DEBOUNCE_MS);

            searchInput.addEventListener('input', debouncedApplyFilters);
            sortFilter.addEventListener('change', applyFilters);
            priceMin.addEventListener('input', debouncedApplyFilters);
            priceMax.addEventListener('input', debouncedApplyFilters);
            availabilityList.addEventListener('change', applyFilters);
            ratingList.addEventListener('change', applyFilters);
            categoriesList.addEventListener('change', applyFilters);

            filtersToggle.addEventListener('click', () => {
                const isOpen = filtersPanel.classList.contains('open');
                filtersPanel.classList.toggle('open', !isOpen);
                filtersToggle.classList.toggle('active', !isOpen);
                filtersToggle.setAttribute('aria-expanded', String(!isOpen));
            });

            applyFiltersBtn?.addEventListener('click', () => {
                applyFilters();
                filtersPanel.classList.remove('open');
                filtersToggle.classList.remove('active');
                filtersToggle.setAttribute('aria-expanded', 'false');
                window.showToast?.('تم تطبيق الفلاتر', 'success');
            });

            resetFiltersBtn?.addEventListener('click', () => {
                searchInput.value = '';
                sortFilter.value = 'default';
                priceMin.value = '';
                priceMax.value = '';
                document.querySelectorAll('input[data-filter="category"]:checked').forEach(cb => cb.checked = false);
                const allAvail = document.querySelector('input[name="availability"][value="all"]');
                if (allAvail) allAvail.checked = true;
                const allRating = document.querySelector('input[name="rating"][value="0"]');
                if (allRating) allRating.checked = true;
                applyFilters();
                window.showToast?.('تم مسح الفلاتر', 'info');
            });

            loadMoreBtn?.addEventListener('click', loadMore);

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentView = btn.dataset.view;
                    localStorage.setItem(VIEW_STORAGE_KEY, currentView);
                    applyView();
                });
            });

            window.addEventListener('scroll', () => {
                backToTop.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function updateOnlineStatus() {
                offlineBanner.classList.toggle('show', !navigator.onLine);
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();

            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('q');
            if (initialQuery && searchInput) {
                searchInput.value = initialQuery;
            }

            applyView(); 
            loadData();

        })();
    </script>

</body>
