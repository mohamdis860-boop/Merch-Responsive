<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تصفح جميع تصنيفات المنتجات في متجرنا">
    <title>التصنيفات - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --bg-dark: #0a0a1a;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: rgba(255, 255, 255, 0.5);
            --radius-card: 20px;
            --transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);

            --icon-c1: #ff6b6b;
            --icon-c2: #6c5ce7;
            --icon-c3: #00cec9;
            --icon-c4: #fd79a8;
            --icon-c5: #ffd93d;
            --icon-c6: #a29bfe;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .bg-animation {
            position: fixed; inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }
        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }
        .bg-animation .blob:nth-child(5) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%; left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(60px, -50px) scale(1.15); }
            50%      { transform: translate(-40px, 40px) scale(0.9); }
            75%      { transform: translate(30px, -30px) scale(1.08); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 30px;
            cursor: pointer;
        }
        .back-btn:hover { color: var(--primary); transform: translateX(-6px); }
        .back-btn i { transition: var(--transition); }
        .back-btn:hover i { transform: translateX(-4px); }

        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-header .tags-icon-big {
            font-size: 60px;
            color: var(--primary);
            display: block;
            margin-bottom: 15px;
            animation: tagsBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }
        @keyframes tagsBounce {
            0%, 100% { transform: translateY(0) rotate(0) scale(1); }
            50%      { transform: translateY(-12px) rotate(-6deg) scale(1.08); }
        }
        .page-header h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 6s ease infinite;
        }
        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        .page-header p { font-size: 18px; color: var(--text-muted); }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1 1 260px;
            position: relative;
            display: flex;
            align-items: center;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 0 16px;
            transition: var(--transition);
        }
        .search-box:focus-within {
            border-color: rgba(255, 107, 107, 0.6);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }
        .search-box i { color: var(--text-muted); font-size: 15px; }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: inherit;
            font-size: 15px;
            padding: 13px 10px;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .search-box .clear-search {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            padding: 6px;
            display: none;
            transition: var(--transition);
        }
        .search-box .clear-search:hover { color: var(--primary); }
        .search-box.has-value .clear-search { display: block; }

        .sort-group {
            display: flex;
            gap: 6px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 5px;
        }
        .sort-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .sort-btn:hover { color: white; }
        .sort-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent3));
            color: white;
            box-shadow: 0 4px 14px rgba(255, 107, 107, 0.35);
        }

        .results-count {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .results-count strong { color: var(--primary); font-weight: 700; }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-card);
            padding: 30px 25px;
            transition:
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                background 0.4s ease,
                border-color 0.4s ease;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            will-change: transform;
            content-visibility: auto;
            contain-intrinsic-size: 0 280px;
        }

        .category-card:nth-child(6n+1) { --icon-color: var(--icon-c1); }
        .category-card:nth-child(6n+2) { --icon-color: var(--icon-c2); }
        .category-card:nth-child(6n+3) { --icon-color: var(--icon-c3); }
        .category-card:nth-child(6n+4) { --icon-color: var(--icon-c4); }
        .category-card:nth-child(6n+5) { --icon-color: var(--icon-c5); }
        .category-card:nth-child(6n+6) { --icon-color: var(--icon-c6); }

        .category-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.08), transparent, rgba(108, 92, 231, 0.08), transparent);
            animation: rotateGlow 10s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .category-card:hover::before { opacity: 1; }
        @keyframes rotateGlow { to { transform: rotate(360deg); } }

        .category-card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 107, 107, 0.25);
            z-index: 10;
        }

        .category-card .category-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            transition: 0.5s;
            position: relative;
            z-index: 1;
            color: var(--icon-color, var(--primary));
            filter: drop-shadow(0 0 12px var(--icon-color, var(--primary)));
        }
        .category-card:hover .category-icon {
            transform: scale(1.25) rotate(-8deg);
        }

        .category-card h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }
        .category-card:hover h3 { color: var(--secondary); }

        .category-card .category-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            transition: 0.4s;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .category-card:hover .category-desc { color: rgba(255, 255, 255, 0.75); }

        .category-card .product-count {
            display: inline-block;
            background: rgba(255, 107, 107, 0.15);
            color: var(--primary);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            position: relative;
            z-index: 1;
            transition: 0.4s;
        }
        .category-card:hover .product-count {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }
        .category-card .product-count i { margin-left: 4px; }

        .category-card .category-id {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .category-card .click-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 12px;
            transition: 0.35s;
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .category-card:hover .click-hint { color: var(--primary); }
        .category-card .click-hint i { transition: 0.4s; }
        .category-card:hover .click-hint i { transform: translateX(-5px); }

        .badge-new {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, var(--secondary), #f39c12);
            color: #1a1a1a;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(255, 217, 61, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }

        .share-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 2;
            opacity: 0;
            transform: translateY(-6px);
            transition: var(--transition);
        }
        .category-card:hover .share-btn { opacity: 1; transform: translateY(0); }
        .share-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
        }
        .loading-spinner i {
            animation: spin 1s linear infinite;
            font-size: 32px;
            color: var(--primary);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.6));
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }
        .empty-state i {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            animation: emptyFloat 3s ease-in-out infinite;
        }
        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        .empty-state p { font-size: 16px; margin-bottom: 16px; }

        .retry-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent3));
            color: white;
            border: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.35);
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 107, 107, 0.5);
        }
        .retry-btn i { transition: var(--transition); }
        .retry-btn:hover i { transform: rotate(180deg); }

        .back-to-top {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent3));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: var(--transition);
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover { transform: translateY(-4px) scale(1.05); }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }
        .offline-banner.show { transform: translateY(0); }

        .footer {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 40px 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }
        .footer i {
            color: var(--primary);
            animation: heartBeat 1.5s ease-in-out infinite;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25%      { transform: scale(1.3); }
            40%      { transform: scale(1); }
            60%      { transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 30px; }
            .main-content { padding: 30px 15px; }
            .categories-grid { grid-template-columns: 1fr 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .sort-group { justify-content: center; }
        }
        @media (max-width: 500px) {
            .categories-grid { grid-template-columns: 1fr; }
            .page-header h1 { font-size: 24px; }
            .page-header .tags-icon-big { font-size: 40px; }
            .sort-btn span { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="../shared/responsive.css">
</head>
<body>

    <div class="offline-banner" id="offlineBanner">
        <i class="fas fa-wifi"></i> أنت غير متصل بالإنترنت
    </div>

    <div class="bg-animation" aria-hidden="true">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="main-content">

        <a href="../index.html" class="back-btn" data-aos="fade-left">
            <i class="fas fa-arrow-right"></i>
            العودة للرئيسية
        </a>

        <div class="page-header" data-aos="fade-down">
            <i class="fas fa-tags tags-icon-big" aria-hidden="true"></i>
            <h1>التصنيفات</h1>
            <p>اختر تصنيفاً لتصفح المنتجات</p>
        </div>

        <div class="toolbar" data-aos="fade-up">
            <div class="search-box" id="searchBox">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن تصنيف..." aria-label="بحث في التصنيفات">
                <button class="clear-search" id="clearSearch" aria-label="مسح البحث">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="sort-group" role="group" aria-label="ترتيب التصنيفات">
                <button class="sort-btn active" data-sort="default">
                    <i class="fas fa-list"></i><span> افتراضي</span>
                </button>
                <button class="sort-btn" data-sort="name">
                    <i class="fas fa-arrow-down-a-z"></i><span> الاسم</span>
                </button>
                <button class="sort-btn" data-sort="count">
                    <i class="fas fa-arrow-down-wide-short"></i><span> الأكثر منتجات</span>
                </button>
            </div>
        </div>

        <div class="results-count" id="resultsCount" hidden>
            <i class="fas fa-circle-info"></i>
            <span>عرض <strong id="visibleCount">0</strong> من <strong id="totalCount">0</strong> تصنيف</span>
        </div>

        <div id="categoriesContainer">
            <div class="skeleton-categories-grid" id="skeletonGrid">
            </div>
        </div>

    </div>

    <button class="back-to-top" id="backToTop" aria-label="العودة للأعلى">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 100 });
    </script>

    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>
    <script src="../shared/notifications.js"></script>

    <script>
        (function() {
            'use strict';

            const ICONS = [
                'fa-layer-group', 'fa-tag', 'fa-cube', 'fa-boxes',
                'fa-th-large', 'fa-list', 'fa-grip', 'fa-table',
                'fa-border-all', 'fa-square', 'fa-circle', 'fa-gem',
                'fa-star', 'fa-heart', 'fa-crown', 'fa-fire'
            ];
            const NEW_BADGE_DAYS = 30; 
            const STORAGE_KEY = 'categories_cache_v1';
            const CACHE_TTL_MS = 5 * 60 * 1000;

            const supabase = window.getSupabase();
            const categoriesContainer = document.getElementById('categoriesContainer');
            const searchInput   = document.getElementById('searchInput');
            const searchBox     = document.getElementById('searchBox');
            const clearSearch   = document.getElementById('clearSearch');
            const resultsCount  = document.getElementById('resultsCount');
            const visibleCountEl = document.getElementById('visibleCount');
            const totalCountEl  = document.getElementById('totalCount');
            const backToTop     = document.getElementById('backToTop');
            const offlineBanner = document.getElementById('offlineBanner');

            let allCards = [];      
            let currentSort = 'default';
            let currentQuery = '';

            const escapeHtml = (text) => {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            };

            const formatNumber = (n) => new Intl.NumberFormat('ar-EG').format(n);

            const getCategoryIcon = (index) => ICONS[index % ICONS.length];

            function goToCategoryProducts(categoryId, categoryName, categoryDesc) {
                if (window.showToast) {
                    window.showToast(`📂 جاري تحميل منتجات "${categoryName}"...`, 'info');
                }
                setTimeout(() => {
                    window.location.href = `category-products.html?id=${encodeURIComponent(categoryId)}&name=${encodeURIComponent(categoryName)}&desc=${encodeURIComponent(categoryDesc || '')}`;
                }, 400);
            }

            async function shareCategory(categoryId, categoryName, event) {
                event.stopPropagation();
                const url = `${window.location.origin}${window.location.pathname.replace(/\/[^/]+$/, '')}/category-products.html?id=${encodeURIComponent(categoryId)}`;
                const data = { title: categoryName, text: `تصفح تصنيف ${categoryName}`, url };

                try {
                    if (navigator.share) {
                        await navigator.share(data);
                    } else if (navigator.clipboard) {
                        await navigator.clipboard.writeText(url);
                        window.showToast?.('✅ تم نسخ الرابط', 'success');
                    }
                } catch (err) {
                }
            }

            function createCategoryCard(item, index, productCounts) {
                const categoryName = String(item.Category_Name ?? '') || 'بدون اسم';
                const description  = String(item.Description ?? '') || 'لا يوجد وصف';
                const categoryId   = item.Category_ID ?? item.id ?? null;

                if (categoryId === null) return null;

                const icon = getCategoryIcon(index);
                const productCount = productCounts[String(categoryId)] || 0;

                const card = document.createElement('div');
                card.className = 'category-card';
                card.dataset.id   = String(categoryId);
                card.dataset.name = categoryName;
                card.dataset.desc = description;
                card.dataset.count = String(productCount);
                card.dataset.index = String(index);
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `تصفح تصنيف ${categoryName}، ${productCount} منتج`);

                if (item.Created_At) {
                    const ageDays = (Date.now() - new Date(item.Created_At).getTime()) / 86400000;
                    if (ageDays <= NEW_BADGE_DAYS) {
                        const badge = document.createElement('span');
                        badge.className = 'badge-new';
                        badge.textContent = 'جديد';
                        card.appendChild(badge);
                    }
                }

                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-btn';
                shareBtn.setAttribute('aria-label', 'مشاركة التصنيف');
                shareBtn.innerHTML = '<i class="fas fa-share-alt"></i>';
                shareBtn.addEventListener('click', (e) => shareCategory(categoryId, categoryName, e));
                card.appendChild(shareBtn);

                const iconEl = document.createElement('i');
                iconEl.className = `fas ${icon} category-icon`;
                iconEl.setAttribute('aria-hidden', 'true');
                card.appendChild(iconEl);

                const title = document.createElement('h3');
                title.textContent = categoryName;
                card.appendChild(title);

                const descEl = document.createElement('p');
                descEl.className = 'category-desc';
                descEl.textContent = description;
                card.appendChild(descEl);

                const countEl = document.createElement('span');
                countEl.className = 'product-count';
                countEl.innerHTML = `<i class="fas fa-box"></i> ${formatNumber(productCount)} منتج`;
                card.appendChild(countEl);

                const idEl = document.createElement('span');
                idEl.className = 'category-id';
                idEl.textContent = `#${categoryId}`;
                card.appendChild(idEl);

                const hintEl = document.createElement('div');
                hintEl.className = 'click-hint';
                hintEl.innerHTML = `<i class="fas fa-arrow-left"></i> اضغط للتصفح`;
                card.appendChild(hintEl);

                card.addEventListener('click', function() {
                    goToCategoryProducts(this.dataset.id, this.dataset.name, this.dataset.desc);
                });
                card.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });

                return card;
            }

            function applyFilterAndSort() {
                const q = currentQuery.trim().toLowerCase();

                let visible = allCards.filter(({ name }) =>
                    !q || name.toLowerCase().includes(q)
                );

                if (currentSort === 'name') {
                    visible.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                } else if (currentSort === 'count') {
                    visible.sort((a, b) => b.count - a.count);
                } else {
                    visible.sort((a, b) => a.index - b.index);
                }

                allCards.forEach(({ el }) => { el.style.display = 'none'; });
                visible.forEach(({ el }) => { el.style.display = ''; });

                if (allCards.length > 0) {
                    resultsCount.hidden = false;
                    visibleCountEl.textContent = formatNumber(visible.length);
                    totalCountEl.textContent   = formatNumber(allCards.length);
                }

                if (visible.length === 0 && q) {
                    let noResult = document.getElementById('noResultMsg');
                    if (!noResult) {
                        noResult = document.createElement('div');
                        noResult.id = 'noResultMsg';
                        noResult.className = 'empty-state';
                        noResult.innerHTML = `
                            <i class="fas fa-search"></i>
                            <p>لا توجد نتائج لبحثك</p>
                        `;
                        categoriesContainer.appendChild(noResult);
                    }
                } else {
                    document.getElementById('noResultMsg')?.remove();
                }
            }

            function setupToolbar() {
                searchInput.addEventListener('input', (e) => {
                    currentQuery = e.target.value;
                    searchBox.classList.toggle('has-value', currentQuery.length > 0);
                    applyFilterAndSort();
                });

                clearSearch.addEventListener('click', () => {
                    searchInput.value = '';
                    currentQuery = '';
                    searchBox.classList.remove('has-value');
                    searchInput.focus();
                    applyFilterAndSort();
                });

                document.querySelectorAll('.sort-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentSort = btn.dataset.sort;
                        applyFilterAndSort();
                    });
                });
            }

            async function loadCategories() {
                if (!supabase) {
                    categoriesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-plug-circle-xmark" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">تعذر الاتصال بالخادم</p>
                            <button class="retry-btn" onclick="location.reload()">
                                <i class="fas fa-rotate-right"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
                    return;
                }

                try {
                    const [catRes, prodRes] = await Promise.all([
                        supabase.from('Category').select('*'),
                        supabase.from('Product').select('Category_ID')
                    ]);

                    if (catRes.error)  throw new Error(catRes.error.message);
                    if (prodRes.error) throw new Error(prodRes.error.message);

                    const categories = catRes.data || [];
                    const products   = prodRes.data || [];

                    const productCounts = products.reduce((acc, p) => {
                        if (p.Category_ID != null) {
                            const k = String(p.Category_ID);
                            acc[k] = (acc[k] || 0) + 1;
                        }
                        return acc;
                    }, {});

                    renderCategories(categories, productCounts);
                } catch (error) {
                    console.error('❌ خطأ:', error);
                    categoriesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-triangle-exclamation" style="color:#ff6b6b;"></i>
                            <p style="color:#ff6b6b;">${escapeHtml(error.message)}</p>
                            <button class="retry-btn" id="retryBtn">
                                <i class="fas fa-rotate-right"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
                    document.getElementById('retryBtn')?.addEventListener('click', loadCategories);
                }
            }

            function renderCategories(categories, productCounts) {
                if (categories.length === 0) {
                    categoriesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>لا توجد تصنيفات حالياً</p>
                        </div>
                    `;
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'categories-grid';

                allCards = [];
                categories.forEach((item, index) => {
                    const card = createCategoryCard(item, index, productCounts);
                    if (!card) return;
                    grid.appendChild(card);
                    allCards.push({
                        el: card,
                        name: card.dataset.name,
                        count: Number(card.dataset.count) || 0,
                        index
                    });
                });

                categoriesContainer.innerHTML = '';
                categoriesContainer.appendChild(grid);

                setupToolbar();
                applyFilterAndSort();

                if (window.AOS?.refresh) AOS.refresh();
            }

            window.addEventListener('scroll', () => {
                backToTop.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function updateOnlineStatus() {
                offlineBanner.classList.toggle('show', !navigator.onLine);
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();

            loadCategories();
        })();
    </script>

</body>
</html>
