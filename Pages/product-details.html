<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تفاصيل المنتج - اقرأ الوصف، التقييمات، وأضف للسلة">
    <title>تفاصيل المنتج - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #6bcb77;
            --error: #ff4757;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-dim: rgba(255, 255, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.04);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 20px;
            --transition: 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        html {
            background-color: #0a0a1a !important;
            overscroll-behavior: none;
        }

        body {
            background-color: #0a0a1a !important;
            background-image: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        @media (max-width: 768px) {
            body {
                background-image: none !important;
                animation: none !important;
            }
        }

        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }
        .bg-animation .blob:nth-child(5) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%; left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(60px, -50px) scale(1.15); }
            50%      { transform: translate(-40px, 40px) scale(0.9); }
            75%      { transform: translate(30px, -30px) scale(1.08); }
        }

        @media (max-width: 768px) {
            .bg-animation { display: none !important; }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 30px 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
            margin-bottom: 25px;
        }
        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-6px);
        }

        .error-state {
            text-align: center;
            padding: 100px 20px;
        }
        .error-state i {
            font-size: 80px;
            color: var(--error);
            margin-bottom: 20px;
            display: block;
        }
        .error-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--error);
        }
        .error-state a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 60px;
        }

        .product-image-box {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .no-image-big {
            font-size: 120px;
            color: rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .product-swiper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            position: relative;
            z-index: 1;
        }
        .product-swiper .swiper-wrapper { align-items: center; }
        .product-swiper .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
            cursor: zoom-in;
        }
        .product-swiper .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }
        .product-swiper .swiper-slide:hover img { transform: scale(1.05); }

        .product-swiper .swiper-button-prev,
        .product-swiper .swiper-button-next {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: var(--transition);
        }
        .product-swiper .swiper-button-prev:hover,
        .product-swiper .swiper-button-next:hover {
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }
        .product-swiper .swiper-button-prev::after,
        .product-swiper .swiper-button-next::after {
            font-size: 16px;
            font-weight: 900;
        }

        .product-swiper .swiper-pagination-bullet {
            background: rgba(255, 255, 255, 0.4);
            opacity: 1;
            width: 8px; height: 8px;
            transition: var(--transition);
        }
        .product-swiper .swiper-pagination-bullet-active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        .share-product-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 5;
        }
        .share-product-btn:hover {
            background: linear-gradient(135deg, var(--accent2), #00b894);
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.4);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-breadcrumb {
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .product-breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
        }
        .product-breadcrumb a:hover { color: var(--primary); }

        .product-name {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.3;
            background: linear-gradient(135deg, #fff, #ffd93d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .stars-row {
            display: flex;
            gap: 3px;
            font-size: 18px;
        }
        .stars-row .star {
            color: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }
        .stars-row .star.filled {
            color: var(--secondary);
            filter: drop-shadow(0 0 6px rgba(255, 217, 61, 0.6));
        }
        .rating-text {
            font-size: 14px;
            color: var(--text-muted);
        }
        .rating-text strong {
            color: var(--secondary);
            font-size: 16px;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
        }
        .meta-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }
        .meta-badge i { color: var(--primary); }
        .meta-badge.available {
            background: rgba(107, 203, 119, 0.12);
            border-color: rgba(107, 203, 119, 0.3);
            color: var(--success);
        }
        .meta-badge.available i { color: var(--success); }
        .meta-badge.unavailable {
            background: rgba(255, 71, 87, 0.12);
            border-color: rgba(255, 71, 87, 0.3);
            color: var(--error);
        }
        .meta-badge.unavailable i { color: var(--error); }

        .price-box {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .price-label {
            font-size: 13px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        .price-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 20px rgba(255, 217, 61, 0.5);
        }

        .description-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
        }
        .description-box h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        .description-box p {
            font-size: 15px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.75);
            white-space: pre-wrap;
        }

        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .quantity-selector {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 4px;
            gap: 6px;
            align-self: flex-start;
        }
        .quantity-selector button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quantity-selector button:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        .quantity-selector button:disabled { opacity: 0.4; cursor: not-allowed; }
        .quantity-selector span {
            font-size: 18px;
            font-weight: 800;
            min-width: 40px;
            text-align: center;
            color: var(--secondary);
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 16px 30px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .add-to-cart-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }
        .add-to-cart-btn:hover:not(:disabled)::before { left: 100%; }
        .add-to-cart-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }
        .add-to-cart-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .buy-now-btn {
            width: 100%;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            background: linear-gradient(135deg, var(--accent), #a29bfe);
            color: white;
            border: none;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .buy-now-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(108, 92, 231, 0.6);
        }
        .buy-now-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .wishlist-btn,
        .compare-btn {
            width: 100%;
            height: 54px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .wishlist-btn i, .compare-btn i { font-size: 18px; transition: transform 0.3s; }

        .wishlist-btn:hover {
            background: rgba(253, 121, 168, 0.12);
            border-color: rgba(253, 121, 168, 0.5);
            color: #fd79a8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 121, 168, 0.25);
        }
        .wishlist-btn:hover i { transform: scale(1.2); }
        .wishlist-btn.active {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 25px rgba(253, 121, 168, 0.5);
        }
        .wishlist-btn.active i { animation: heartBeat 0.5s; }

        .compare-btn:hover {
            background: rgba(108, 92, 231, 0.12);
            border-color: rgba(108, 92, 231, 0.5);
            color: #a29bfe;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.25);
        }
        .compare-btn:hover i { transform: rotate(15deg) scale(1.15); }
        .compare-btn.active {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-color: transparent;
            color: white;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25%      { transform: scale(1.3); }
            50%      { transform: scale(1); }
            75%      { transform: scale(1.2); }
        }

        .reviews-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .section-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .section-title i { color: var(--primary); }
        .section-title .count {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 30px;
            margin-right: auto;
        }

        .rating-distribution {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .rating-dist-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .rating-dist-row .label {
            color: rgba(255, 255, 255, 0.7);
            min-width: 50px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rating-dist-row .label i { color: var(--secondary); font-size: 11px; }
        .rating-dist-row .bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        .rating-dist-row .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #f39c12);
            border-radius: 4px;
            transition: width 0.6s ease;
            box-shadow: 0 0 10px rgba(255, 217, 61, 0.4);
        }
        .rating-dist-row .count {
            color: var(--text-muted);
            min-width: 30px;
            text-align: left;
            font-weight: 600;
        }

        .review-filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .review-filter-chip {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .review-filter-chip:hover {
            background: rgba(255, 107, 107, 0.1);
            color: white;
        }
        .review-filter-chip.active {
            background: linear-gradient(135deg, var(--primary), #ee5a24);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.35);
        }

        .add-review-box {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .add-review-box h4 {
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .add-review-box h4 i { color: var(--secondary); }

        .rating-input {
            display: flex;
            gap: 5px;
            font-size: 28px;
            margin-bottom: 15px;
            direction: rtl;
        }
        .rating-input i {
            color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: 0.25s;
        }
        .rating-input i:hover,
        .rating-input i.active {
            color: var(--secondary);
            transform: scale(1.15);
        }

        .comment-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            outline: none;
        }
        .comment-input:focus {
            border-color: var(--primary);

    <script>
        (function() {
            'use strict';

            const PRODUCT_CACHE_KEY = 'product_cache_v1_';
            const CACHE_TTL_MS = 5 * 60 * 1000;

            const supabase = window.getSupabase?.();
            let currentUser = null;
            let currentProduct = null;
            let currentQuantity = 1;
            let selectedRating = 0;
            let currentCategoryName = '';
            let productSwiper = null;
            let allReviews = [];
            let reviewFilter = 0;

            const skeletonContainer     = document.getElementById('skeletonContainer');
            const errorState            = document.getElementById('errorState');
            const productContent        = document.getElementById('productContent');
            const backToTop             = document.getElementById('backToTop');
            const offlineBanner         = document.getElementById('offlineBanner');
            const imageZoomOverlay      = document.getElementById('imageZoomOverlay');
            const zoomImage             = document.getElementById('zoomImage');
            const closeZoom             = document.getElementById('closeZoom');
            const shareProductBtn       = document.getElementById('shareProductBtn');

            const escapeHtml = (text) => {
                if (text == null) return '';
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            };

            const formatPrice = (price) =>
                new Intl.NumberFormat('ar-EG').format(Number(price) || 0) + ' ج.م';

            function getProductId() {
                const params = new URLSearchParams(window.location.search);
                return params.get('id');
            }

            function getStarsHTML(rating) {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    html += `<i class="fas fa-star star ${i <= Math.round(rating) ? 'filled' : ''}"></i>`;
                }
                return html;
            }

            function getWishlist() {
                try {
                    return JSON.parse(localStorage.getItem('wishlist')) || [];
                } catch (e) {
                    return [];
                }
            }

            function isInWishlist(productId) {
                return getWishlist().some(id => String(id) === String(productId));
            }

            function toggleWishlist(productId) {
                let wishlist = getWishlist();
                const strId = String(productId);
                let added = false;

                if (wishlist.includes(strId)) {
                    wishlist = wishlist.filter(id => id !== strId);
                } else {
                    wishlist.push(strId);
                    added = true;
                }

                try {
                    localStorage.setItem('wishlist', JSON.stringify(wishlist));
                } catch (e) { /* ignore */ }

                window.dispatchEvent(new CustomEvent('wishlistUpdated'));
                return added;
            }

            function readCache(productId) {
                try {
                    const raw = sessionStorage.getItem(PRODUCT_CACHE_KEY + productId);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (Date.now() - parsed.ts > CACHE_TTL_MS) return null;
                    return parsed.data;
                } catch (e) { return null; }
            }

            function writeCache(productId, data) {
                try {
                    sessionStorage.setItem(
                        PRODUCT_CACHE_KEY + productId,
                        JSON.stringify({ ts: Date.now(), data })
                    );
                } catch (e) { /* ignore */ }
            }

            async function loadCurrentUser() {
                if (!supabase) return;
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    currentUser = session?.user || null;
                } catch (err) { /* silent */ }
            }

            async function loadProduct() {
                await loadCurrentUser();

                const productId = getProductId();
                if (!productId) {
                    showError();
                    return;
                }

                if (!supabase) {
                    showError();
                    return;
                }

                try {
                    const cached = readCache(productId);
                    if (cached) {
                        currentProduct = cached.product;
                        currentCategoryName = cached.categoryName || '';
                        skeletonContainer.style.display = 'none';
                        productContent.style.display = 'block';
                        renderProduct();
                        loadReviews();
                        loadSimilarProducts();
                        return;
                    }

                    const { data: product, error } = await supabase
                        .from('Product')
                        .select('*')
                        .eq('Product_ID', parseInt(productId, 10))
                        .single();

                    if (error || !product) {
                        showError();
                        return;
                    }

                    currentProduct = product;

                    if (product.Category_ID) {
                        const { data: category } = await supabase
                            .from('Category')
                            .select('Category_Name')
                            .eq('Category_ID', product.Category_ID)
                            .single();

                        if (category) currentCategoryName = category.Category_Name;
                    }

                    writeCache(productId, { product, categoryName: currentCategoryName });

                    skeletonContainer.style.display = 'none';
                    productContent.style.display = 'block';

                    renderProduct();
                    loadReviews();
                    loadSimilarProducts();

                } catch (err) {
                    console.error('❌ Load error:', err);
                    showError();
                }
            }

            function showError() {
                skeletonContainer.style.display = 'none';
                errorState.style.display = 'block';
            }

            function renderProduct() {
                const p = currentProduct;

                const swiperWrapper = document.getElementById('swiperWrapper');
                const imgUrl = window.getImageUrl ? window.getImageUrl(p.Image_URL) : null;

                if (imgUrl) {
                    swiperWrapper.innerHTML = `
                        <div class="swiper-slide">
                            <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.Product_Name)}" data-zoomable="true">
                        </div>
                    `;
                } else {
                    swiperWrapper.innerHTML = `
                        <div class="swiper-slide">
                            <i class="fas fa-image no-image-big"></i>
                        </div>
                    `;
                }

                setTimeout(() => {
                    if (productSwiper) productSwiper.destroy(true, true);
                    productSwiper = new Swiper('.product-swiper', {
                        loop: false,
                        spaceBetween: 10,
                        pagination: { el: '.swiper-pagination', clickable: true },
                        navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                        effect: 'slide',
                        speed: 400,
                    });
                }, 100);

                document.getElementById('breadcrumbName').textContent = p.Product_Name || 'منتج';
                document.getElementById('productName').textContent = p.Product_Name || 'بدون اسم';

                document.getElementById('ratingStars').innerHTML = getStarsHTML(p.Rating || 0);
                document.getElementById('ratingValue').textContent = Number(p.Rating || 0).toFixed(1);
                document.getElementById('ratingCount').textContent = `${p.Review_Count || 0} مراجعة`;

                const statusAvailable = (p.Status || '').toLowerCase() === 'available'
                                     || (p.Status || '').toLowerCase() === 'active'
                                     || !p.Status;
                const metaHTML = `
                    ${currentCategoryName ? `
                        <span class="meta-badge">
                            <i class="fas fa-tags"></i>
                            ${escapeHtml(currentCategoryName)}
                        </span>
                    ` : ''}
                    ${p.Unit ? `
                        <span class="meta-badge">
                            <i class="fas fa-cube"></i>
                            ${escapeHtml(p.Unit)}
                        </span>
                    ` : ''}
                    <span class="meta-badge ${statusAvailable ? 'available' : 'unavailable'}">
                        <i class="fas fa-${statusAvailable ? 'check-circle' : 'times-circle'}"></i>
                        ${statusAvailable ? 'متاح' : 'غير متاح'}
                    </span>
                `;
                document.getElementById('productMeta').innerHTML = metaHTML;

                document.getElementById('productPrice').textContent = formatPrice(p.Selling_Price);
                document.getElementById('productCode').textContent = '#' + (p.Product_ID || '—');

                const desc = p.Description && p.Description.trim() !== ''
                    ? p.Description
                    : 'لا يوجد وصف تفصيلي لهذا المنتج.';
                document.getElementById('productDescription').textContent = desc;

                currentQuantity = 1;
                document.getElementById('quantityValue').textContent = currentQuantity;

                const wishlistBtn = document.getElementById('wishlistBtn');
                if (isInWishlist(p.Product_ID)) {
                    wishlistBtn.classList.add('active');
                    wishlistBtn.innerHTML = '<i class="fas fa-heart"></i><span>في المفضلة</span>';
                } else {
                    wishlistBtn.classList.remove('active');
                    wishlistBtn.innerHTML = '<i class="far fa-heart"></i><span>المفضلة</span>';
                }

                const addBtn = document.getElementById('addToCartBtn');
                const buyNowBtn = document.getElementById('buyNowBtn');
                if (!statusAvailable) {
                    addBtn.disabled = true;
                    addBtn.querySelector('span').textContent = 'غير متاح';
                    if (buyNowBtn) buyNowBtn.disabled = true;
                }

                updateCompareBtnState();
            }

            const compareBtn = document.getElementById('compareBtn');

            function updateCompareBtnState() {
                if (!compareBtn || !currentProduct) return;

                const inCompare = window.isInCompare && window.isInCompare(currentProduct.Product_ID);

                if (inCompare) {
                    compareBtn.classList.add('active');
                    compareBtn.innerHTML = '<i class="fas fa-check"></i><span>في المقارنة</span>';
                } else {
                    compareBtn.classList.remove('active');
                    compareBtn.innerHTML = '<i class="fas fa-balance-scale"></i><span>المقارنة</span>';
                }
            }

            compareBtn?.addEventListener('click', () => {
                if (!currentProduct) return;
                if (!window.toggleCompare) {
                    window.showToast?.('❌ المقارنة غير متاحة', 'error');
                    return;
                }
                window.toggleCompare({
                    id: currentProduct.Product_ID,
                    name: currentProduct.Product_Name,
                    price: parseFloat(currentProduct.Selling_Price) || 0,
                    image: currentProduct.Image_URL || ''
                });
                updateCompareBtnState();
            });

            window.addEventListener('compareUpdated', updateCompareBtnState);

            document.getElementById('increaseQty').addEventListener('click', () => {
                if (currentQuantity < 99) {
                    currentQuantity++;
                    document.getElementById('quantityValue').textContent = currentQuantity;
                }
            });

            document.getElementById('decreaseQty').addEventListener('click', () => {
                if (currentQuantity > 1) {
                    currentQuantity--;
                    document.getElementById('quantityValue').textContent = currentQuantity;
                }
            });

            document.getElementById('addToCartBtn').addEventListener('click', function() {
                const statusAvailable = (currentProduct.Status || '').toLowerCase() === 'available'
                                     || (currentProduct.Status || '').toLowerCase() === 'active'
                                     || !currentProduct.Status;
                if (!statusAvailable) {
                    window.showToast?.('❌ المنتج غير متاح حالياً', 'error');
                    return;
                }

                for (let i = 0; i < currentQuantity; i++) {
                    window.addToCartItem?.(
                        currentProduct.Product_ID,
                        currentProduct.Product_Name,
                        parseFloat(currentProduct.Selling_Price) || 0,
                        currentProduct.Image_URL || ''
                    );
                }

                const btn = this;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i><span>تمت الإضافة</span>';
                btn.style.background = 'linear-gradient(135deg, #6bcb77, #4caf50)';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 1500);
            });

            document.getElementById('buyNowBtn')?.addEventListener('click', function() {
                const statusAvailable = (currentProduct.Status || '').toLowerCase() === 'available'
                                     || (currentProduct.Status || '').toLowerCase() === 'active'
                                     || !currentProduct.Status;
                if (!statusAvailable) {
                    window.showToast?.('❌ المنتج غير متاح حالياً', 'error');
                    return;
                }

                for (let i = 0; i < currentQuantity; i++) {
                    window.addToCartItem?.(
                        currentProduct.Product_ID,
                        currentProduct.Product_Name,
                        parseFloat(currentProduct.Selling_Price) || 0,
                        currentProduct.Image_URL || ''
                    );
                }

                setTimeout(() => {
                    window.location.href = 'checkout.html';
                }, 300);
            });

            document.getElementById('wishlistBtn').addEventListener('click', function() {
                const added = toggleWishlist(currentProduct.Product_ID);

                if (added) {
                    this.classList.add('active');
                    this.innerHTML = '<i class="fas fa-heart"></i><span>في المفضلة</span>';
                    window.showToast?.('❤️ تم إضافة المنتج للمفضلة', 'success');
                } else {
                    this.classList.remove('active');
                    this.innerHTML = '<i class="far fa-heart"></i><span>المفضلة</span>';
                    window.showToast?.('💔 تم إزالة المنتج من المفضلة', 'info');
                }
            });

            shareProductBtn?.addEventListener('click', async () => {
                if (!currentProduct) return;
                const url = window.location.href;
                const data = {
                    title: currentProduct.Product_Name,
                    text: `شوف ${currentProduct.Product_Name} على متجرنا`,
                    url
                };
                try {
                    if (navigator.share) await navigator.share(data);
                    else if (navigator.clipboard) {
                        await navigator.clipboard.writeText(url);
                        window.showToast?.('✅ تم نسخ رابط المنتج', 'success');
                    }
                } catch (e) { /* cancelled */ }
            });

            function openZoom(src, alt) {
                if (!imageZoomOverlay || !zoomImage) return;
                zoomImage.src = src;
                zoomImage.alt = alt || '';
                imageZoomOverlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeZoomFunc() {
                imageZoomOverlay.classList.remove('show');
                document.body.style.overflow = '';
            }

            closeZoom?.addEventListener('click', closeZoomFunc);
            imageZoomOverlay?.addEventListener('click', (e) => {
                if (e.target === imageZoomOverlay) closeZoomFunc();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && imageZoomOverlay?.classList.contains('show')) {
                    closeZoomFunc();
                }
            });

            document.addEventListener('click', (e) => {
                const target = e.target.closest('.product-swiper .swiper-slide img[data-zoomable]');
                if (target) {
                    openZoom(target.src, target.alt);
                }
            });

            async function loadReviews() {
                const productId = currentProduct.Product_ID;

                try {
                    const { data: reviews, error } = await supabase
                        .from('Reviews')
                        .select('*')
                        .eq('product_id', productId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    allReviews = reviews || [];

                    renderRatingDistribution(allReviews);
                    renderReviewForm();
                    renderReviews(allReviews);

                } catch (err) {
                    console.error('Reviews error:', err);
                    allReviews = [];
                    renderRatingDistribution([]);
                    renderReviewForm();
                    renderReviews([]);
                }
            }

            function renderRatingDistribution(reviews) {
                const container = document.getElementById('ratingDistributionContainer');
                if (!container) return;

                if (reviews.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                const total = reviews.length;
                const counts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
                reviews.forEach(r => {
                    const rating = Math.round(r.rating);
                    if (counts[rating] !== undefined) counts[rating]++;
                });

                let html = '<div class="rating-distribution">';
                for (let i = 5; i >= 1; i--) {
                    const c = counts[i];
                    const percent = total > 0 ? (c / total) * 100 : 0;
                    html += `
                        <div class="rating-dist-row">
                            <div class="label">${i} <i class="fas fa-star"></i></div>
                            <div class="bar">
                                <div class="bar-fill" style="width: ${percent}%"></div>
                            </div>
                            <div class="count">${c}</div>
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            }

            function renderReviewFilters(reviews) {
                const list = document.getElementById('reviewsList');
                if (!list) return;

                const existing = document.querySelector('.review-filter-chips');
                if (existing) existing.remove();

                if (reviews.length === 0) return;

                const chips = document.createElement('div');
                chips.className = 'review-filter-chips';
                chips.innerHTML = `
                    <button class="review-filter-chip ${reviewFilter === 0 ? 'active' : ''}" data-filter="0">الكل</button>
                    ${[5,4,3,2,1].map(n => `
                        <button class="review-filter-chip ${reviewFilter === n ? 'active' : ''}" data-filter="${n}">
                            ${n} <i class="fas fa-star"></i>
                        </button>
                    `).join('')}
                `;

                list.parentElement.insertBefore(chips, list);

                chips.querySelectorAll('.review-filter-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        reviewFilter = parseInt(chip.dataset.filter, 10);
                        const filtered = reviewFilter === 0
                            ? allReviews
                            : allReviews.filter(r => Math.round(r.rating) === reviewFilter);
                        renderReviews(filtered);
                    });
                });
            }

            function renderReviewForm() {
                const container = document.getElementById('reviewFormContainer');

                if (!currentUser) {
                    container.innerHTML = `
                        <div class="login-prompt">
                            <i class="fas fa-lock"></i>
                            <p>لازم تسجّل دخول عشان تكتب مراجعة</p>
                            <a href="../Auth/login.html">
                                <i class="fas fa-sign-in-alt"></i>
                                تسجيل الدخول
                            </a>
                        </div>
                    `;
                    return;
                }

                supabase
                    .from('Reviews')
                    .select('review_id')
                    .eq('product_id', currentProduct.Product_ID)
                    .eq('customer_id', currentUser.id)
                    .maybeSingle()
                    .then(({ data }) => {
                        if (data) {
                            container.innerHTML = `
                                <div class="login-prompt" style="background: rgba(107, 203, 119, 0.1); border-color: rgba(107, 203, 119, 0.4);">
                                    <i class="fas fa-check-circle" style="color: var(--success);"></i>
                                    <p>لقد قمت بتقييم هذا المنتج بالفعل</p>
                                </div>
                            `;
                        } else {
                            container.innerHTML = `
                                <div class="add-review-box">
                                    <h4>
                                        <i class="fas fa-pen"></i>
                                        اكتب مراجعتك
                                    </h4>
                                    <div class="rating-input" id="ratingInput">
                                        <i class="fas fa-star" data-rating="1"></i>
                                        <i class="fas fa-star" data-rating="2"></i>
                                        <i class="fas fa-star" data-rating="3"></i>
                                        <i class="fas fa-star" data-rating="4"></i>
                                        <i class="fas fa-star" data-rating="5"></i>
                                    </div>
                                    <textarea
                                        class="comment-input"
                                        id="commentInput"
                                        placeholder="شاركنا تجربتك مع المنتج..."
                                        maxlength="500"
                                    ></textarea>
                                    <button class="submit-review-btn" id="submitReviewBtn">
                                        <i class="fas fa-paper-plane"></i>
                                        إرسال المراجعة
                                    </button>
                                </div>
                            `;
                            attachReviewEvents();
                        }
                    });
            }

            function attachReviewEvents() {
                const stars = document.querySelectorAll('#ratingInput i');
                stars.forEach(star => {
                    star.addEventListener('mouseenter', function() {
                        const r = parseInt(this.dataset.rating, 10);
                        stars.forEach((s, i) => s.classList.toggle('active', i < r));
                    });

                    star.addEventListener('click', function() {
                        selectedRating = parseInt(this.dataset.rating, 10);
                        stars.forEach((s, i) => s.classList.toggle('active', i < selectedRating));
                    });
                });

                const ratingInput = document.getElementById('ratingInput');
                ratingInput?.addEventListener('mouseleave', () => {
                    stars.forEach((s, i) => s.classList.toggle('active', i < selectedRating));
                });

                document.getElementById('submitReviewBtn')?.addEventListener('click', submitReview);
            }

            async function submitReview() {
                const comment = document.getElementById('commentInput').value.trim();
                const btn = document.getElementById('submitReviewBtn');

                if (selectedRating === 0) {
                    window.showToast?.('❌ اختر تقييم من 1 إلى 5 نجوم', 'error');
                    return;
                }
                if (!comment) {
                    window.showToast?.('❌ اكتب مراجعتك الأول', 'error');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الإرسال...';

                try {
                    const { error } = await supabase
                        .from('Reviews')
                        .insert({
                            product_id: currentProduct.Product_ID,
                            customer_id: currentUser.id,
                            rating: selectedRating,
                            comment: comment
                        });

                    if (error) throw error;

                    window.showToast?.('✅ تم إرسال مراجعتك بنجاح', 'success');

                    await new Promise(r => setTimeout(r, 800));

                    const { data: updatedProduct } = await supabase
                        .from('Product')
                        .select('Rating, Review_Count')
                        .eq('Product_ID', currentProduct.Product_ID)
                        .single();

                    if (updatedProduct) {
                        currentProduct.Rating = updatedProduct.Rating;
                        currentProduct.Review_Count = updatedProduct.Review_Count;
                        document.getElementById('ratingStars').innerHTML = getStarsHTML(updatedProduct.Rating || 0);
                        document.getElementById('ratingValue').textContent = Number(updatedProduct.Rating || 0).toFixed(1);
                        document.getElementById('ratingCount').textContent = `${updatedProduct.Review_Count || 0} مراجعة`;
                    }

                    try {
                        sessionStorage.removeItem(PRODUCT_CACHE_KEY + currentProduct.Product_ID);
                    } catch (e) {}

                    reviewFilter = 0;
                    loadReviews();

                } catch (error) {
                    console.error('❌ Review error:', error);
                    window.showToast?.('❌ ' + error.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال المراجعة';
                }
            }

            function renderReviews(reviews) {
                const list = document.getElementById('reviewsList');
                const countEl = document.getElementById('reviewsCountTitle');
                if (countEl) countEl.textContent = reviews.length;

                if (reviews.length === 0) {
                    list.innerHTML = `
                        <div class="empty-reviews">
                            <i class="fas fa-comment-slash"></i>
                            <h3>لا توجد مراجعات بعد</h3>
                            <p>كن أول من يشارك تجربته مع هذا المنتج</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                reviews.forEach((review, index) => {
                    const starsHTML = Array.from({ length: 5 }, (_, i) =>
                        `<i class="fas fa-star ${i < review.rating ? 'filled' : ''}"></i>`
                    ).join('');

                    const date = new Date(review.created_at).toLocaleDateString('ar-EG', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });

                    html += `
                        <div class="review-card" style="animation-delay: ${index * 0.05}s">
                            <div class="review-header">
                                <div class="review-avatar" data-customer-id="${review.customer_id}">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div class="review-author">
                                    <h5 class="review-name" data-customer-id="${review.customer_id}">جاري التحميل...</h5>
                                    <span><i class="far fa-clock"></i> ${date}</span>
                                </div>
                                <div class="review-stars">${starsHTML}</div>
                            </div>
                            <p class="review-comment">${escapeHtml(review.comment)}</p>
                        </div>
                    `;
                });

                list.innerHTML = html;
                renderReviewFilters(reviews);
                fetchCustomerNames(reviews.map(r => r.customer_id));
            }

            async function fetchCustomerNames(customerIds) {
                if (!customerIds || customerIds.length === 0) return;

                try {
                    const { data: customers } = await supabase
                        .from('Customers')
                        .select('id, Name')
                        .in('id', customerIds);

                    if (customers) {
                        customers.forEach(c => {
                            document.querySelectorAll(`.review-name[data-customer-id="${c.id}"]`).forEach(el => {
                                el.textContent = c.Name || 'عميل';
                            });
                            document.querySelectorAll(`.review-avatar[data-customer-id="${c.id}"]`).forEach(el => {
                                el.textContent = (c.Name || 'ع').charAt(0).toUpperCase();
                            });
                        });
                    }
                } catch (err) { /* silent */ }
            }

            async function loadSimilarProducts() {
                if (!currentProduct.Category_ID) return;

                try {
                    const { data: products, error } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL')
                        .eq('Category_ID', currentProduct.Category_ID)
                        .neq('Product_ID', currentProduct.Product_ID)
                        .limit(4);

                    if (error) throw error;

                    const grid = document.getElementById('similarGrid');

                    if (!products || products.length === 0) {
                        grid.innerHTML = `
                            <div style="grid-column: 1/-1; text-align: center; padding: 30px; color: rgba(255,255,255,0.4);">
                                <i class="fas fa-box-open" style="font-size: 40px; margin-bottom: 10px; display: block;"></i>
                                لا توجد منتجات مشابهة
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    products.forEach((p, index) => {
                        const imgUrl = window.getImageUrl ? window.getImageUrl(p.Image_URL) : null;
                        html += `
                            <a href="product-details.html?id=${p.Product_ID}"
                               class="similar-card"
                               style="animation-delay: ${index * 0.1}s">
                                <div class="img-wrapper">
                                    ${imgUrl
                                        ? `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.Product_Name)}" loading="lazy">`
                                        : `<i class="fas fa-image no-image"></i>`
                                    }
                                </div>
                                <h4>${escapeHtml(p.Product_Name)}</h4>
                                <div class="similar-price">${formatPrice(p.Selling_Price)}</div>
                            </a>
                        `;
                    });

                    grid.innerHTML = html;

                } catch (err) { /* silent */ }
            }

            window.addEventListener('scroll', () => {
                backToTop?.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            backToTop?.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            function updateOnlineStatus() {
                offlineBanner?.classList.toggle('show', !navigator.onLine);
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();

            loadProduct();

        })();
    </script>

</body>
</html>
