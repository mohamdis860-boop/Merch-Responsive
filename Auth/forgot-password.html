<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/toast.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --success: #6bcb77;
            --error: #ff4757;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }
        .bg-animation .blob:nth-child(5) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%; left: 10%;
            animation-delay: -11s;
            opacity: 0.25;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.05);
            font-size: 40px;
            animation: floatIcon 7s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        .floating-icon:nth-child(1) { top: 12%; left: 8%; }
        .floating-icon:nth-child(2) { top: 75%; left: 6%; animation-delay: -1.5s; }
        .floating-icon:nth-child(3) { top: 18%; right: 10%; animation-delay: -3s; }
        .floating-icon:nth-child(4) { top: 80%; right: 12%; animation-delay: -4.5s; }
        .floating-icon:nth-child(5) { top: 48%; left: 4%; animation-delay: -2s; font-size: 28px; }
        .floating-icon:nth-child(6) { top: 55%; right: 5%; animation-delay: -5s; font-size: 32px; }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
        }

        .forgot-container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 460px;
            animation: forgotEnter 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes forgotEnter {
            0% { opacity: 0; transform: scale(0.9) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .forgot-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 45px 40px 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .forgot-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 217, 61, 0.06), transparent, rgba(255, 107, 107, 0.06), transparent);
            animation: rotateGlow 12s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: 0.35s;
            z-index: 2;
            font-size: 15px;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, var(--secondary), #f39c12);
            color: white;
            transform: scale(1.1) rotate(-8deg);
            box-shadow: 0 8px 20px rgba(255, 217, 61, 0.4);
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .forgot-logo {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd93d, #f39c12, #fd79a8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: logoPulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255, 217, 61, 0.5);
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 217, 61, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(255, 217, 61, 0.8); }
        }

        .forgot-logo i {
            font-size: 38px;
            color: white;
        }

        .forgot-title {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffd93d, #ff6b6b, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 5s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .forgot-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
        }

        .forgot-form {
            position: relative;
            z-index: 1;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            transition: 0.4s;
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(255, 217, 61, 0.25);
            transform: translateY(-2px);
        }

        .input-wrapper .input-icon {
            padding: 0 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            transition: 0.35s;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--secondary);
            transform: scale(1.1);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 0;
            color: white;
            font-size: 15px;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ffd93d, #f39c12);
            color: #1a1a2a;
            box-shadow: 0 10px 30px rgba(255, 217, 61, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover::after { left: 100%; }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 217, 61, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #1a1a2a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .spinner.active { display: inline-block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .back-to-login {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
        }

        .back-to-login a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 700;
            transition: 0.35s;
            margin-right: 5px;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .success-state {
            display: none;
            text-align: center;
            padding: 20px 0;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        .success-state.show { display: block; }

        .success-icon {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: rgba(107, 203, 119, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 2px solid rgba(107, 203, 119, 0.4);
            animation: successPulse 2s ease-in-out infinite;
        }

        @keyframes successPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(107, 203, 119, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(107, 203, 119, 0); }
        }

        .success-icon i {
            font-size: 45px;
            color: var(--success);
        }

        .success-state h3 {
            font-size: 22px;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 10px;
        }

        .success-state p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .success-state .email-highlight {
            color: var(--secondary);
            font-weight: 700;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .forgot-card { padding: 35px 25px 30px; border-radius: 24px; }
            .forgot-logo { width: 70px; height: 70px; }
            .forgot-logo i { font-size: 32px; }
            .forgot-title { font-size: 22px; }
            .input-wrapper input { padding: 13px 0; font-size: 14px; }
            .submit-btn { padding: 14px; font-size: 16px; }
            .back-btn { width: 36px; height: 36px; font-size: 14px; }
        }
    </style>
    <link rel="stylesheet" href="../shared/responsive.css">
</head>
<body>

    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <i class="fas fa-key floating-icon"></i>
    <i class="fas fa-lock floating-icon"></i>
    <i class="fas fa-unlock floating-icon"></i>
    <i class="fas fa-envelope floating-icon"></i>
    <i class="fas fa-shield-alt floating-icon"></i>
    <i class="fas fa-user-shield floating-icon"></i>

    <div class="forgot-container">
        <div class="forgot-card">

            <a href="login.html" class="back-btn" title="العودة لتسجيل الدخول">
                <i class="fas fa-arrow-right"></i>
            </a>

            <div class="forgot-header">
                <div class="forgot-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="forgot-title">نسيت كلمة المرور؟</h1>
                <p class="forgot-subtitle">
                    لا تقلق! اكتب إيميلك وهنبعتلك رابط لإعادة تعيين كلمة المرور
                </p>
            </div>

            <form class="forgot-form" id="forgotForm" novalidate>
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="spinner" id="spinner"></span>
                    <i class="fas fa-paper-plane" id="submitIcon"></i>
                    <span id="submitText">إرسال رابط إعادة التعيين</span>
                </button>
            </form>

            <div class="success-state" id="successState">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3>تم الإرسال بنجاح! ✉️</h3>
                <p>
                    بعتنالك رابط على الإيميل:
                    <br>
                    <span class="email-highlight" id="sentEmail">example@email.com</span>
                    <br><br>
                    افتح الإيميل واضغط على الرابط لتغيير كلمة المرور
                </p>
                <button class="submit-btn" onclick="resetForm()" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white;">
                    <i class="fas fa-redo"></i>
                    إرسال مرة أخرى
                </button>
            </div>

            <p class="back-to-login">
                تذكرت كلمة المرور؟
                <a href="login.html">سجّل دخولك</a>
            </p>

        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script src="../shared/toast.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            const forgotForm = document.getElementById('forgotForm');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitIcon = document.getElementById('submitIcon');
            const spinner = document.getElementById('spinner');
            const successState = document.getElementById('successState');
            const sentEmail = document.getElementById('sentEmail');

            function setLoading(isLoading) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    spinner.classList.add('active');
                    submitIcon.style.display = 'none';
                    submitText.textContent = 'جاري الإرسال...';
                } else {
                    submitBtn.disabled = false;
                    spinner.classList.remove('active');
                    submitIcon.style.display = 'inline-block';
                    submitText.textContent = 'إرسال رابط إعادة التعيين';
                }
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            window.resetForm = function() {
                successState.classList.remove('show');
                forgotForm.style.display = 'block';
                emailInput.value = '';
                emailInput.focus();
            };

            forgotForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    window.showToast('❌ من فضلك اكتب البريد الإلكتروني', 'error');
                    emailInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    window.showToast('❌ صيغة البريد الإلكتروني غير صحيحة', 'error');
                    emailInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const resetUrl = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');

                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: resetUrl
                    });

                    if (error) throw error;

                    console.log('✅ Reset email sent');

                    setLoading(false);
                    sentEmail.textContent = email;
                    forgotForm.style.display = 'none';
                    successState.classList.add('show');
                    window.showToast('✅ تم إرسال رابط إعادة التعيين', 'success');

                } catch (error) {
                    console.error('❌ Error:', error);

                    let message = error.message;
                    if (message.includes('rate limit')) {
                        message = 'محاولات كثيرة، انتظر شوية وحاول تاني';
                    } else if (message.includes('User not found')) {
                        message = 'البريد الإلكتروني غير مسجل';
                    }

                    setLoading(false);
                    window.showToast('❌ ' + message, 'error');
                }
            });

            console.log('%c🔑 Forgot Password page loaded', 'color: #ffd93d; font-size: 18px; font-weight: bold;');

        })();
    </script>

</body>
</html>
