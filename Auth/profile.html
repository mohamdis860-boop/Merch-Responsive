<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البروفايل - متجرنا</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/navbar.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <link rel="stylesheet" href="../shared/footer.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b6b;
            --secondary: #ffd93d;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --success: #6bcb77;
            --error: #ff4757;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #12122a 30%, #1a1a3e 60%, #0f0f2a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-animation {
            position: fixed; inset: 0;
            z-index: 0; overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobFloat 22s infinite ease-in-out;
        }

        .bg-animation .blob:nth-child(1) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6b6b, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-animation .blob:nth-child(2) {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #6c5ce7, transparent 70%);
            bottom: -200px; right: -200px;
            animation-delay: -7s;
        }
        .bg-animation .blob:nth-child(3) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00cec9, transparent 70%);
            top: 40%; left: 60%;
            animation-delay: -14s;
        }
        .bg-animation .blob:nth-child(4) {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #fd79a8, transparent 70%);
            top: 10%; right: 20%;
            animation-delay: -4s;
        }
        .bg-animation .blob:nth-child(5) {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #ffd93d, transparent 70%);
            bottom: 10%; left: 10%;
            animation-delay: -11s;
            opacity: 0.2;
        }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -50px) scale(1.15); }
            50% { transform: translate(-40px, 40px) scale(0.9); }
            75% { transform: translate(30px, -30px) scale(1.08); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 30px 60px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header .icon-big {
            font-size: 55px;
            color: var(--primary);
            display: block;
            margin-bottom: 12px;
            animation: iconBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5));
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.08); }
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6c5ce7, #00cec9, #fd79a8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 6s ease infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page-header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
        }

        .profile-header-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.9s ease-out 0.2s both;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .profile-header-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 107, 107, 0.06), transparent, rgba(108, 92, 231, 0.06), transparent);
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #fd79a8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 50px;
            font-weight: 900;
            color: white;
            position: relative;
            z-index: 1;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(108, 92, 231, 0.5);
            animation: avatarPulse 3s ease-in-out infinite;
            transition: 0.4s;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(108, 92, 231, 0.5); }
            50% { box-shadow: 0 0 55px rgba(108, 92, 231, 0.9); }
        }

        .profile-avatar:hover {
            transform: scale(1.08) rotate(-5deg);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #fff, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-email {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .profile-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(107, 203, 119, 0.15);
            color: var(--success);
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            flex-wrap: wrap;
            animation: fadeInUp 0.9s ease-out 0.3s both;
        }

        .tab-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.35s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-title i {
            color: var(--primary);
            font-size: 22px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.35s;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-row:last-child { border-bottom: none; }

        .info-row:hover {
            padding-right: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .info-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-label i {
            color: var(--accent);
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.35s;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 107, 107, 0.6);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            background: rgba(255, 107, 107, 0.1);
            transform: translateY(-3px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 35px rgba(255, 71, 87, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .order-card::before {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .order-card:hover::before { opacity: 1; }

        .order-card:hover {
            transform: translateX(-6px);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id {
            font-size: 15px;
            font-weight: 700;
            color: var(--secondary);
            font-family: 'Courier New', monospace;
        }

        .order-status {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .order-status.pending {
            background: rgba(255, 217, 61, 0.15);
            color: var(--secondary);
        }

        .order-status.shipped {
            background: rgba(0, 206, 201, 0.15);
            color: var(--accent2);
        }

        .order-status.delivered {
            background: rgba(107, 203, 119, 0.15);
            color: var(--success);
        }

        .order-status.cancelled {
            background: rgba(255, 71, 87, 0.15);
            color: var(--error);
        }

        .order-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .order-amount {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .order-meta {
            margin-top: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .order-meta i {
            color: var(--accent);
        }

        .order-shipping {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 10px;
            border-right: 3px solid var(--accent);
        }

        .order-shipping i {
            color: var(--primary);
            margin-left: 4px;
        }

        .order-items {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .order-items-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .order-items-title i {
            color: var(--secondary);
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 6px;
            transition: 0.3s;
        }

        .order-item-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .order-item-row .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .order-item-row .item-info i {
            color: var(--accent2);
            font-size: 12px;
        }

        .order-item-row .item-price {
            color: var(--secondary);
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state i {
            font-size: 70px;
            color: rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            display: block;
            animation: emptyFloat 3s ease-in-out infinite;
        }

        @keyframes emptyFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .empty-state h3 {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title i { color: var(--accent); }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.35s;
        }

        .modal-close:hover {
            background: var(--error);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.35s;
        }

        .form-input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.25);
        }

        .form-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .main-content { padding: 20px 15px 40px; }
            .page-header h1 { font-size: 28px; }
            .profile-avatar { width: 100px; height: 100px; font-size: 40px; }
            .profile-name { font-size: 22px; }
            .tab-btn { padding: 10px 14px; font-size: 13px; }
            .info-row { flex-direction: column; align-items: flex-start; }
            .info-value { text-align: right; width: 100%; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="../shared/responsive.css">
</head>
<body>

    <div class="bg-animation">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div id="loadingScreen" style="
        position: relative;
        z-index: 5;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 30px 60px;
    ">
        <div style="
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            margin-bottom: 25px;
        ">
            <div class="skeleton" style="width: 120px; height: 120px; margin: 0 auto 20px; border-radius: 50%;"></div>
            <div class="skeleton" style="width: 200px; height: 28px; margin: 0 auto 12px; border-radius: 8px;"></div>
            <div class="skeleton" style="width: 250px; height: 16px; margin: 0 auto 15px; border-radius: 6px;"></div>
            <div class="skeleton" style="width: 120px; height: 30px; margin: 0 auto; border-radius: 30px;"></div>
        </div>

        <div class="skeleton" style="width: 100%; height: 60px; border-radius: 16px; margin-bottom: 25px;"></div>

        <div style="
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
        ">
            <div class="skeleton" style="width: 180px; height: 22px; margin-bottom: 20px; border-radius: 8px;"></div>
            <div style="padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div class="skeleton" style="width: 150px; height: 16px; border-radius: 6px;"></div>
            </div>
            <div style="padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div class="skeleton" style="width: 200px; height: 16px; border-radius: 6px;"></div>
            </div>
            <div style="padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div class="skeleton" style="width: 170px; height: 16px; border-radius: 6px;"></div>
            </div>
            <div style="padding: 16px 0;">
                <div class="skeleton" style="width: 120px; height: 16px; border-radius: 6px;"></div>
            </div>
        </div>
    </div>

    <div class="main-content" id="mainContent" style="display: none;">

        <div class="page-header">
            <i class="fas fa-user-circle icon-big"></i>
            <h1>بروفايل المستخدم</h1>
            <p>إدارة بياناتك الشخصية وطلباتك</p>
        </div>

        <div class="profile-header-card">
            <div class="profile-avatar" id="avatar">
                <span id="avatarLetter">م</span>
            </div>
            <h2 class="profile-name" id="profileName">جاري التحميل...</h2>
            <p class="profile-email" id="profileEmail">...</p>
            <span class="profile-badge">
                <i class="fas fa-check-circle"></i>
                حساب مُفعّل
            </span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="info">
                <i class="fas fa-user"></i> البيانات
            </button>
            <button class="tab-btn" data-tab="orders">
                <i class="fas fa-shopping-bag"></i> طلباتي
            </button>
            <button class="tab-btn" data-tab="wishlist">
                <i class="fas fa-heart"></i> المفضلة
            </button>
            <button class="tab-btn" data-tab="security">
                <i class="fas fa-lock"></i> الأمان
            </button>
        </div>

        <div class="tab-content active" id="tab-info">
            <div class="info-card">
                <h3 class="card-title">
                    <i class="fas fa-id-card"></i>
                    البيانات الشخصية
                </h3>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-user"></i>
                        الاسم بالكامل
                    </span>
                    <span class="info-value" id="infoName">—</span>
                </div>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-envelope"></i>
                        البريد الإلكتروني
                    </span>
                    <span class="info-value" id="infoEmail">—</span>
                </div>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-phone"></i>
                        رقم الموبايل
                    </span>
                    <span class="info-value" id="infoPhone">—</span>
                </div>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-map-marker-alt"></i>
                        العنوان
                    </span>
                    <span class="info-value" id="infoAddress">—</span>
                </div>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-city"></i>
                        المدينة
                    </span>
                    <span class="info-value" id="infoCity">—</span>
                </div>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-calendar"></i>
                        تاريخ التسجيل
                    </span>
                    <span class="info-value" id="infoCreated">—</span>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="openEditModal()">
                        <i class="fas fa-edit"></i>
                        تعديل البيانات
                    </button>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-orders">
            <div class="info-card">
                <h3 class="card-title">
                    <i class="fas fa-shopping-bag"></i>
                    طلباتي
                </h3>
                <div id="ordersContainer"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-wishlist">
            <div class="info-card">
                <h3 class="card-title">
                    <i class="fas fa-heart"></i>
                    المفضلة
                </h3>
                <div id="wishlistContainer"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-security">
            <div class="info-card">
                <h3 class="card-title">
                    <i class="fas fa-shield-alt"></i>
                    إعدادات الأمان
                </h3>

                <div class="info-row">
                    <span class="info-label">
                        <i class="fas fa-key"></i>
                        كلمة المرور
                    </span>
                    <span class="info-value">••••••••</span>
                </div>

                <div class="btn-group">
                    <button class="btn btn-outline" onclick="openPasswordModal()">
                        <i class="fas fa-key"></i>
                        تغيير كلمة المرور
                    </button>
                    <button class="btn btn-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-edit"></i>
                    تعديل البيانات
                </h3>
                <button class="modal-close" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="editForm">
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" class="form-input" id="editName" required>
                </div>

                <div class="form-group">
                    <label>رقم الموبايل</label>
                    <input type="tel" class="form-input" id="editPhone" maxlength="11" required>
                </div>

                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" class="form-input" id="editAddress">
                </div>

                <div class="form-group">
                    <label>المدينة</label>
                    <input type="text" class="form-input" id="editCity">
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني (غير قابل للتعديل)</label>
                    <input type="email" class="form-input" id="editEmail" disabled>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="saveEditBtn">
                    <i class="fas fa-save"></i>
                    حفظ التعديلات
                </button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">
                    <i class="fas fa-key"></i>
                    تغيير كلمة المرور
                </h3>
                <button class="modal-close" onclick="closePasswordModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="passwordForm">
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" class="form-input" id="newPassword" required minlength="6">
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" class="form-input" id="confirmNewPassword" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="savePasswordBtn">
                    <i class="fas fa-save"></i>
                    تحديث كلمة المرور
                </button>
            </form>
        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script src="../shared/cart.js"></script>
    <script src="../shared/wishlist.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../shared/footer.js"></script>

    <script>
        (function() {
            const supabase = window.getSupabase();
            if (!supabase) {
                console.warn('⚠️ Supabase not available');
                return;
            }

            let currentUser = null;
            let currentCustomer = null;
            let ordersLoaded = false;
            let wishlistLoaded = false;

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                    btn.classList.add('active');
                    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

                    if (btn.dataset.tab === 'orders' && !ordersLoaded) {
                        ordersLoaded = true;
                        loadOrders();
                    }
                    if (btn.dataset.tab === 'wishlist' && !wishlistLoaded) {
                        wishlistLoaded = true;
                        loadWishlist();
                    }
                });
            });

            async function loadProfile() {
                try {
                    const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                    if (sessionError || !session) {
                        window.showToast('❌ يجب تسجيل الدخول أولاً', 'error');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                        return;
                    }

                    currentUser = session.user;
                    console.log('✅ User:', currentUser.email);

                    const { data: customer, error: customerError } = await supabase
                        .from('Customers')
                        .select('*')
                        .eq('id', currentUser.id)
                        .single();

                    if (customerError) {
                        console.warn('⚠️ No customer record:', customerError.message);
                        currentCustomer = {
                            Name: currentUser.user_metadata?.name || 'مستخدم',
                            Email: currentUser.email,
                            Phone: currentUser.user_metadata?.phone || '—',
                            Address: currentUser.user_metadata?.address || '—',
                            City: currentUser.user_metadata?.city || '—',
                            created_at: currentUser.created_at
                        };
                    } else {
                        currentCustomer = customer;
                    }

                    displayProfile();

                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';

                    handleUrlParams();

                } catch (error) {
                    console.error('❌ Error:', error);
                    window.showToast('❌ ' + error.message, 'error');
                }
            }

            function handleUrlParams() {
                const urlParams = new URLSearchParams(window.location.search);
                const tabParam = urlParams.get('tab');

                if (tabParam === 'orders') {
                    const ordersTab = document.querySelector('[data-tab="orders"]');
                    if (ordersTab) ordersTab.click();
                }

                if (urlParams.get('success') === '1') {
                    const orderId = urlParams.get('order');
                    setTimeout(() => {
                        window.showToast(`✅ تم استلام طلبك رقم #${orderId} بنجاح!`, 'success');
                    }, 800);
                }
            }

            function displayProfile() {
                const name = currentCustomer.Name || currentUser.user_metadata?.name || 'مستخدم';
                const email = currentUser.email;
                const phone = currentCustomer.Phone || currentUser.user_metadata?.phone || '—';
                const address = currentCustomer.Address || currentUser.user_metadata?.address || '—';
                const city = currentCustomer.City || currentUser.user_metadata?.city || '—';
                const created = new Date(currentUser.created_at).toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                document.getElementById('avatarLetter').textContent = name.charAt(0).toUpperCase();
                document.getElementById('profileName').textContent = name;
                document.getElementById('profileEmail').textContent = email;

                document.getElementById('infoName').textContent = name;
                document.getElementById('infoEmail').textContent = email;
                document.getElementById('infoPhone').textContent = phone;
                document.getElementById('infoAddress').textContent = address;
                document.getElementById('infoCity').textContent = city;
                document.getElementById('infoCreated').textContent = created;
            }

            async function loadOrders() {
                const container = document.getElementById('ordersContainer');

                container.innerHTML = Array(3).fill(0).map(() => `
                    <div style="background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:20px; margin-bottom:15px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                            <div class="skeleton" style="width:80px; height:20px; border-radius:6px;"></div>
                            <div class="skeleton" style="width:100px; height:24px; border-radius:30px;"></div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                            <div class="skeleton" style="width:140px; height:16px; border-radius:6px;"></div>
                            <div class="skeleton" style="width:90px; height:22px; border-radius:8px;"></div>
                        </div>
                        <div class="skeleton" style="width:100%; height:50px; border-radius:10px;"></div>
                    </div>
                `).join('');

                try {
                    const { data: orders, error } = await supabase
                        .from('Order')
                        .select('*')
                        .eq('Customer_ID', currentUser.id)
                        .order('Order_Date', { ascending: false });

                    if (error) throw error;

                    if (!orders || orders.length === 0) {
                        showEmpty(container, 'fas fa-shopping-bag', 'لا توجد طلبات', 'لم تقم بأي طلبات حتى الآن', '../Pages/products.html', 'ابدأ التسوق');
                        return;
                    }

                    const orderIds = orders.map(o => o.Order_ID);
                    const { data: allItems } = await supabase
                        .from('Order_Items')
                        .select('*')
                        .in('Order_ID', orderIds);

                    const itemsByOrder = {};
                    (allItems || []).forEach(item => {
                        if (!itemsByOrder[item.Order_ID]) itemsByOrder[item.Order_ID] = [];
                        itemsByOrder[item.Order_ID].push(item);
                    });

                    let html = '';
                    orders.forEach(order => {
                        html += buildOrderCard(order, itemsByOrder[order.Order_ID] || []);
                    });

                    container.innerHTML = html;

                } catch (error) {
                    console.error('❌ Orders error:', error);
                    showEmpty(container, 'fas fa-shopping-bag', 'لا توجد طلبات', 'لم تقم بأي طلبات حتى الآن', '../Pages/products.html', 'ابدأ التسوق');
                }
            }

            function buildOrderCard(order, items) {
                const status = (order.Status || 'pending').toLowerCase();
                const statusText = {
                    'pending': 'قيد المعالجة',
                    'shipped': 'تم الشحن',
                    'delivered': 'تم التسليم',
                    'cancelled': 'ملغي'
                }[status] || status;

                const date = new Date(order.Order_Date).toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const paymentText = {
                    'cod': '💵 الدفع عند الاستلام',
                    'card': '💳 بطاقة ائتمان',
                    'wallet': '📱 محفظة إلكترونية'
                }[order.Payment_Method] || order.Payment_Method || '—';

                const shippingInfo = order.Shipping_Address ? `
                    <div class="order-shipping">
                        <i class="fas fa-map-marker-alt"></i>
                        ${escapeHtml(order.Shipping_Address)}
                    </div>
                ` : '';

                const itemsHTML = items.length > 0 ? `
                    <div class="order-items">
                        <div class="order-items-title">
                            <i class="fas fa-box"></i> المنتجات (${items.length})
                        </div>
                        ${items.map(item => `
                            <div class="order-item-row">
                                <div class="item-info">
                                    <i class="fas fa-cube"></i>
                                    منتج #${item.Product_ID} × ${item.Quantity}
                                </div>
                                <div class="item-price">
                                    ${Number(item.Total_Price).toLocaleString('en-US')} ج.م
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : '';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="order-id">#${order.Order_ID}</span>
                            <span class="order-status ${status}">${statusText}</span>
                        </div>
                        <div class="order-details">
                            <span class="order-date">
                                <i class="fas fa-calendar"></i>
                                ${date}
                            </span>
                            <span class="order-amount">
                                ${Number(order.Total_Amount).toLocaleString('en-US')} ج.م
                            </span>
                        </div>
                        <div class="order-meta">
                            <i class="fas fa-wallet"></i>
                            ${paymentText}
                        </div>
                        ${shippingInfo}
                        ${itemsHTML}
                    </div>
                `;
            }

            async function loadWishlist() {
                const container = document.getElementById('wishlistContainer');
                const wishlistIds = window.getWishlist ? window.getWishlist() : [];

                if (wishlistIds.length === 0) {
                    showEmpty(container, 'fas fa-heart-broken', 'المفضلة فاضية', 'مفيش أي منتجات في المفضلة لحد الآن', '../Pages/products.html', 'ابدأ التسوق');
                    return;
                }

                try {
                    const { data: products, error } = await supabase
                        .from('Product')
                        .select('Product_ID, Product_Name, Selling_Price, Image_URL')
                        .in('Product_ID', wishlistIds.map(id => parseInt(id)).filter(id => !isNaN(id)));

                    if (error) throw error;

                    if (!products || products.length === 0) {
                        showEmpty(container, 'fas fa-heart-broken', 'المفضلة فاضية', 'مفيش أي منتجات في المفضلة لحد الآن', '../Pages/products.html', 'ابدأ التسوق');
                        return;
                    }

                    let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">';
                    products.forEach(p => {
                        const imageUrl = window.getImageUrl ? window.getImageUrl(p.Image_URL) : '';
                        const price = parseFloat(p.Selling_Price) || 0;

                        html += `
                            <div style="background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:15px; transition:0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
                                <div style="width:100%; height:120px; border-radius:10px; overflow:hidden; margin-bottom:10px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center;">
                                    ${imageUrl ?
                                        `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(p.Product_Name)}" style="width:100%; height:100%; object-fit:cover;">` :
                                        `<i class="fas fa-image" style="font-size:30px; color:rgba(255,255,255,0.15);"></i>`
                                    }
                                </div>
                                <h4 style="font-size:14px; margin-bottom:6px; line-height:1.4;">${escapeHtml(p.Product_Name)}</h4>
                                <div style="font-size:16px; font-weight:800; color:var(--secondary);">
                                    ${price > 0 ? Number(price).toLocaleString('en-US') + ' ج.م' : '—'}
                                </div>
                                <a href="../Pages/product-details.html?id=${encodeURIComponent(p.Product_ID)}" style="display:inline-flex; align-items:center; gap:5px; margin-top:10px; color:var(--primary); text-decoration:none; font-size:13px; font-weight:600;">
                                    <i class="fas fa-eye"></i> التفاصيل
                                </a>
                            </div>
                        `;
                    });
                    html += '</div>';

                    container.innerHTML = html;

                } catch (error) {
                    console.error('❌ Wishlist error:', error);
                    showEmpty(container, 'fas fa-exclamation-circle', 'حصل خطأ', error.message, '../Pages/products.html', 'تصفح المنتجات');
                }
            }

            function showEmpty(container, icon, title, text, link, btnText) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="${icon}"></i>
                        <h3>${title}</h3>
                        <p>${text}</p>
                        <a href="${link}" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i>
                            ${btnText}
                        </a>
                    </div>
                `;
            }

            window.openEditModal = function() {
                document.getElementById('editName').value = currentCustomer.Name || '';
                document.getElementById('editPhone').value = currentCustomer.Phone || '';
                document.getElementById('editAddress').value = currentCustomer.Address || '';
                document.getElementById('editCity').value = currentCustomer.City || '';
                document.getElementById('editEmail').value = currentUser.email;

                document.getElementById('editModal').classList.add('show');
            };

            window.closeEditModal = function() {
                document.getElementById('editModal').classList.remove('show');
            };

            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const name = document.getElementById('editName').value.trim();
                const phone = document.getElementById('editPhone').value.trim();
                const address = document.getElementById('editAddress').value.trim();
                const city = document.getElementById('editCity').value.trim();

                if (!name || !phone) {
                    window.showToast('❌ الاسم والموبايل مطلوبين', 'error');
                    return;
                }

                const btn = document.getElementById('saveEditBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الحفظ...';

                try {
                    const { error: customerError } = await supabase
                        .from('Customers')
                        .update({
                            Name: name,
                            Phone: phone,
                            Address: address,
                            City: city
                        })
                        .eq('id', currentUser.id);

                    if (customerError) {
                        console.warn('⚠️ Customer update failed:', customerError.message);
                    }

                    const { error: metadataError } = await supabase.auth.updateUser({
                        data: {
                            name: name,
                            phone: phone,
                            address: address,
                            city: city
                        }
                    });

                    if (metadataError) throw metadataError;

                    currentCustomer.Name = name;
                    currentCustomer.Phone = phone;
                    currentCustomer.Address = address;
                    currentCustomer.City = city;

                    displayProfile();
                    closeEditModal();
                    window.showToast('✅ تم حفظ التعديلات بنجاح', 'success');

                } catch (error) {
                    console.error('❌ Save error:', error);
                    window.showToast('❌ ' + error.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
                }
            });

            window.openPasswordModal = function() {
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                document.getElementById('passwordModal').classList.add('show');
            };

            window.closePasswordModal = function() {
                document.getElementById('passwordModal').classList.remove('show');
            };

            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const newPass = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmNewPassword').value;

                if (newPass.length < 6) {
                    window.showToast('❌ كلمة المرور قصيرة جداً', 'error');
                    return;
                }

                if (newPass !== confirmPass) {
                    window.showToast('❌ كلمتا المرور غير متطابقتين', 'error');
                    return;
                }

                const btn = document.getElementById('savePasswordBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري التحديث...';

                try {
                    const { error } = await supabase.auth.updateUser({
                        password: newPass
                    });

                    if (error) throw error;

                    closePasswordModal();
                    window.showToast('✅ تم تحديث كلمة المرور', 'success');

                } catch (error) {
                    console.error('❌ Password error:', error);
                    window.showToast('❌ ' + error.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> تحديث كلمة المرور';
                }
            });

            window.logout = async function() {
                if (!confirm('هل تريد تسجيل الخروج؟')) return;

                try {
                    window.currentUser = null;
                    await supabase.auth.signOut();

                    window.showToast('👋 تم تسجيل الخروج', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                } catch (error) {
                    window.showToast('❌ ' + error.message, 'error');
                }
            };

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('show');
                    }
                });
            });

            loadProfile();

            console.log('%c👤 Profile page loaded', 'color: #ff6b6b; font-size: 18px; font-weight: bold;');

        })();
    </script>
</body>
